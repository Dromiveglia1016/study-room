<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>study room · 我的书桌</title>
<meta name="description" content="正计时番茄钟：学够了才算付款成功。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF3E3">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="assets/shop.css">
</head>
<body data-page="desk">

<main class="desk wrap">
  <div class="desk__head">
    <div>
      <h1>MY DESK<em>我 的 书 桌</em></h1>
    </div>
    <p id="headline">—</p>
  </div>

  <div class="stats">
    <div class="stat stat--pink">
      <p class="stat__k">积分余额</p>
      <p class="stat__v"><span id="stPts">0</span><small>pts</small></p>
    </div>
    <div class="stat stat--orange">
      <p class="stat__k">今日学习</p>
      <p class="stat__v" id="stMin">0<small>min</small></p>
    </div>
    <div class="stat">
      <p class="stat__k">连续天数</p>
      <p class="stat__v" id="stStreak">0<small>天</small></p>
    </div>
  </div>

  <div id="tasks"></div>

  <section class="cal">
    <div class="cal__head">
      <div>
        <h2>学习日历</h2>
        <p class="cal__sub">学过的那天会亮起来 · 点一天看那天学了什么</p>
      </div>
      <div class="cal__nav">
        <button type="button" id="calPrev" aria-label="上个月">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="cal__label" id="calLabel">—</span>
        <button type="button" id="calNext" aria-label="下个月">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
    <div class="cal__body">
      <div>
        <div class="cal__week" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div class="cal__grid" id="calGrid"></div>
      </div>
      <div class="cal__side">
        <aside class="cal__detail" id="calDetail"></aside>
        <div class="cal__mcard" id="calMonth"></div>
      </div>
    </div>
  </section>

  <section class="hist">
    <div class="hist__head">
      <h2>结算记录</h2>
      <span>最近 8 笔</span>
    </div>
    <div id="history"></div>
  </section>
</main>

<footer class="foot wrap">
  <span class="foot__l">计时是正的：学多少记多少，超了还能多拿。</span>
  <span>study room © 2026</span>
</footer>

<script src="assets/data.js" defer></script>
<script src="assets/store.js" defer></script>
<script src="assets/ui.js" defer></script>
<script src="assets/desk.js" defer></script>
<script src="assets/timer.js" defer></script>
</body>
</html>
