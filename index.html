<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>study room · 今天也学一点</title>
<meta name="description" content="一个用学习时间买单的小房间：学科商店、英语故事、书桌计时，都从这里进去。">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F1ECE1">
<link rel="icon" href="favicon.ico">
<link rel="preload" as="image" href="assets/home/bg.jpg">
<link rel="stylesheet" href="assets/home.css">
</head>
<body data-page="home">

<main class="scene" id="scene">

  <div class="bg" id="bg">
    <img src="assets/home/bg.jpg" alt="" id="bgImg" fetchpriority="high" decoding="async">
  </div>
  <div class="bg__tint"></div>

  <div class="stars" aria-hidden="true">
    <span class="star star--a"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--b"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--c"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--d"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--e"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--f"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--g"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--h"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
    <span class="star star--i"><svg viewBox="0 0 24 24"><path d="M12 1.6l2.7 6.4 6.9.6-5.2 4.6 1.5 6.8L12 16.5 6.1 20l1.5-6.8L2.4 8.6l6.9-.6z"/></svg></span>
  </div>

  <!-- ============================ 导航 ============================ -->
  <header class="top">
    <a class="logo" href="index.html" aria-label="study room 主页">study<i>room</i><b>a softer way</b></a>
    <nav class="top__mid" aria-label="主导航">
      <a href="shop.html">商店</a>
      <a href="subjects/english/index.html">英语</a>
      <a href="desk.html">书桌</a>
      <a href="rewards.html">兑换</a>
    </nav>
    <a class="pill" href="shop.html">
      <span class="pill__dot" aria-hidden="true"></span>
      <span class="pill__txt">去学</span>一点
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </a>
  </header>

  <!-- ============================ 主标题 ============================ -->
  <section class="hero" id="hero">
    <p class="hero__kick"><i></i>a room for slow days</p>
    <h1>
      <span>今天</span>
      <span>也学<em>一点</em></span>
      <span>就好。</span>
    </h1>
    <p class="hero__sub">学多久都算数，<b>时间会变成积分</b>，积分换成奶茶、电影，和一场好觉。</p>
  </section>

  <span class="scrap scrap--a" aria-hidden="true"></span>
  <span class="scrap scrap--b" aria-hidden="true"></span>
  <span class="scrap scrap--c" aria-hidden="true"></span>

  <!-- ============================ 玩偶 ============================ -->
  <div class="toys">
    <button class="toy toy--bunny" id="bunny" type="button" aria-label="果冻兔">
      <img src="assets/home/bunny.webp" alt="一只果冻质感的兔子玩偶" draggable="false">
    </button>
    <button class="toy toy--cat" id="cat" type="button" aria-label="纸袋猫">
      <img src="assets/home/cat.webp" alt="一只戴着纸袋的猫玩偶" draggable="false">
    </button>
  </div>
  <div class="bubble" id="bubble" role="status">今天想先学哪一科？</div>

  <!-- ============================ 两张纸片 ============================ -->
  <a class="note note--shop" id="noteShop" href="shop.html" data-sheet="shop">
    <span class="note__hole" aria-hidden="true"></span>
    <span class="note__k">01 / shop</span>
    <span class="note__t">学科商店</span>
    <span class="note__d">用学习时间买单，学够了才结算。</span>
    <span class="note__go">点开看看
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </span>
  </a>

  <a class="note note--en" id="noteEn" href="subjects/english/index.html" data-sheet="en">
    <span class="note__hole" aria-hidden="true"></span>
    <span class="note__k">02 / english</span>
    <span class="note__t">Word Journey</span>
    <span class="note__d">每天一篇单词故事，把词读进句子里。</span>
    <span class="note__go">点开看看
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </span>
  </a>

  <!-- ============================ 今日小卡 ============================ -->
  <a class="dcard" href="desk.html" id="dcard" aria-label="打开我的书桌">
    <div class="dcard__stack" aria-hidden="true">
      <div class="dcard__sheet"></div>
      <div class="dcard__sheet"></div>
    </div>
    <div class="dcard__main">
      <div class="dcard__row">
        <span class="dcard__k">today</span>
        <span class="dcard__go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></span>
      </div>
      <div class="dcard__v"><span id="dcardMin">0</span><small>min</small></div>
      <div class="dcard__row">
        <span class="dcard__tag" id="dcardTag">还没开始，第一段总是最难</span>
      </div>
    </div>
  </a>

  <!-- ============================ 底部 dock ============================ -->
  <nav class="dock" aria-label="快捷入口">
    <a class="dock__i" href="shop.html" aria-label="学科商店">
      <svg viewBox="0 0 24 24"><path d="M4 8h16l-1.4 11.2a1.6 1.6 0 0 1-1.6 1.4H7a1.6 1.6 0 0 1-1.6-1.4L4 8Z"/><path d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"/></svg>
      <span>商店</span>
    </a>
    <a class="dock__i" href="desk.html" aria-label="我的书桌">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.4l2.6 1.6M9 2h6"/></svg>
      <span>书桌</span>
    </a>
    <a class="dock__i" href="rewards.html" aria-label="积分兑换">
      <svg viewBox="0 0 24 24"><path d="M3 9.5V7a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v2.5a2.5 2.5 0 0 0 0 5V19a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-4.5a2.5 2.5 0 0 0 0-5Z"/><path d="M14 6v12" stroke-dasharray="2 3"/></svg>
      <span>兑换</span>
    </a>
    <span class="dock__sep" aria-hidden="true"></span>
    <a class="dock__i" href="subjects/english/index.html" aria-label="英语故事">
      <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M8 7.5h7M8 11h5"/></svg>
      <span>英语</span>
    </a>
  </nav>

  <!-- ============================ 展开的纸卡 ============================ -->
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT" hidden>
    <div class="sheet__scrim" data-close></div>
    <article class="sheet__paper">
      <button class="sheet__close" type="button" data-close aria-label="关上">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <p class="sheet__k" id="sheetK">01 / shop</p>
      <h2 class="sheet__t" id="sheetT">学科商店</h2>
      <p class="sheet__d" id="sheetD">用学习时间买单，学够了才结算。</p>
      <ul class="sheet__list" id="sheetL"></ul>
      <div class="sheet__acts">
        <a class="btn btn--ink" id="sheetGo" href="shop.html">出发
          <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
        </a>
        <button class="btn btn--ghost" type="button" data-close>再想想</button>
      </div>
    </article>
  </div>

</main>

<script src="assets/home.js" defer></script>
</body>
</html>
