er</summary><span class=\"hintbox\"><b>teacher</b> · 结合上下文理解</span></details> <details class=\"wordhint\"><summary>asks</summary><span class=\"hintbox\"><b>asks</b> · 问；要求</span></details> <details class=\"wordhint\"><summary>students</summary><span class=\"hintbox\"><b>students</b> · 学生（复数）</span></details> <details class=\"wordhint\"><summary>to</summary><span class=\"hintbox\"><b>to</b> · 去；向；（不定式标记）</span></details> <details class=\"wordhint target-word\"><summary>quote</summary><span class=\"hintbox\"><b>quote</b> · 引用，引述（动词）；引文（名词）</span></details> <details class=\"wordhint\"><summary>one</summary><span class=\"hintbox\"><b>one</b> · 一个</span></details> <details class=\"wordhint\"><summary>useful</summary><span class=\"hintbox\"><b>useful</b> · 有用的</span></details> <details class=\"wordhint\"><summary>sentence</summary><span class=\"hintbox\"><b>sentence</b> · 句子</span></details> <details class=\"wordhint\"><summary>from</summary><span class=\"hintbox\"><b>from</b> · 从</span></details> <details class=\"wordhint\"><summary>their</summary><span class=\"hintbox\"><b>their</b> · 他们的</span></details> <details class=\"wordhint\"><summary>notes</summary><span class=\"hintbox\"><b>notes</b> · 笔记</span></details>. <details class=\"wordhint\"><summary>The</summary><span class=\"hintbox\"><b>The</b> · 这/那；定冠词</span></details> <details class=\"wordhint target-word\"><summary>quotation</summary><span class=\"hintbox\"><b>quotation</b> · 引文，引语（名词）</span></details> <details class=\"wordhint\"><summary>she</summary><span class=\"hintbox\"><b>she</b> · 她</span></details> <details class=\"wordhint\"><summary>writes</summary><span class=\"hintbox\"><b>writes</b> · 写</span></details> <details class=\"wordhint\"><summary>on</summary><span class=\"hintbox\"><b>on</b> · 继续；在……上</span></details> <details class=\"wordhint\"><summary>the</summary><span class=\"hintbox\"><b>the</b> · 这/那；定冠词</span></details> <details class=\"wordhint\"><summary>board</summary><span class=\"hintbox\"><b>board</b> · 黑板</span></details> <details class=\"wordhint\"><summary>comes</summary><span class=\"hintbox\"><b>comes</b> · 来</span></details> <details class=\"wordhint\"><summary>from</summary><span class=\"hintbox\"><b>from</b> · 从</span></details> <details class=\"wordhint\"><summary>a</summary><span class=\"hintbox\"><b>a</b> · 结合上下文理解</span></details> <details class=\"wordhint\"><summary>famous</summary><span class=\"hintbox\"><b>famous</b> · 著名的</span></details> <details class=\"wordhint\"><summary>writer</summary><span class=\"hintbox\"><b>writer</b> · 作家</span></details>: <details class=\"wordhint\"><summary>small</summary><span class=\"hintbox\"><b>small</b> · 小的</span></details> <details class=\"wordhint\"><summary>steps</summary><span class=\"hintbox\"><b>steps</b> · 步骤</span></details> <details class=\"wordhint\"><summary>beat</summary><span class=\"hintbox\"><b>beat</b> · 胜过</span></details> <details class=\"wordhint target-word\"><summary>constant</summary><span class=\"hintbox\"><b>constant</b> · 经常的，不断的；恒定的</span></details> <details class=\"wordhint\"><summary>pressure</summary><span class=\"hintbox\"><b>pressure</b> · 压力</span></details>. <details class=\"wordhint\"><summary>Nina</summary><span class=\"hintbox\"><b>Nina</b> · Nina（人名）</span></details> <details class=\"wordhint\"><summary>writes</summary><span class=\"hintbox\"><b>writes</b> · 写</span></details> <details class=\"wordhint\"><summary>it</summary><span class=\"hintbox\"><b>it</b> · 它</span></details> <details class=\"wordhint\"><summary>down</summary><span class=\"hintbox\"><b>down</b> · 向下；记下</span></details>, <details class=\"wordhint\"><summary>and</summary><span class=\"hintbox\"><b>and</b> · 和；并且</span></details> <details class=\"wordhint target-word\"><summary>constantly</summary><span class=\"hintbox\"><b>constantly</b> · 持续不断地，经常地（副词）</span></details> <details class=\"wordhint\"><summary>reminds</summary><span class=\"hintbox\"><b>reminds</b> · 提醒</span></details> <details class=\"wordhint\"><summary>herself</summary><span class=\"hintbox\"><b>herself</b> · 她自己</span></details> <details class=\"wordhint\"><summary>to</summary><span class=\"hintbox\"><b>to</b> · 去；向；（不定式标记）</span></details> <details class=\"wordhint\"><summary>practice</summary><span class=\"hintbox\"><b>practice</b> · 练习</span></details> <details class=\"wordhint\"><summary>daily</summary><span class=\"hintbox\"><b>daily</b> · 每天</span></details>.</p></div>\n<details class=\"disclosure\"><summary>显示 / 隐藏中文翻译</summary><div class=\"inside translation\" id=\"translation\" style=\"display:block\">在一场进行中的社区讲习班里，几位高年级学生协助新来的同学复习英语。志愿者 Mia 向安静的女孩 Nina 提供帮助，她的辅助笔记里满是疑问。Nina 坚称自己能赶上进度，但 Mia 坚持下来，坐到了她身边。<br/><br/>阅读文章变难时，Nina 努力克制自己不放弃。她发现有些学习者对新方法有抵触，不过她自己对改变的抗拒慢慢消退了。讲习班由小组任务、样题练习和小测验组成。老师们的方法始终如一：他们一贯地复习相同要点，直到每个人都听懂；临时抱佛脚之类前后不一致的习惯则不被鼓励。<br/><br/>一张即时复习讲义发了下来，房间里立刻安静下来。老师让学生们引用笔记中一句有用的话。她写在黑板上的引文出自一位著名作家：小小的步骤胜过持续不断的压力。Nina 把这句话记下，并不断提醒自己每天练习。</div></details></section><details class=\"grammar-module\" id=\"sentence-analysis\"><div class=\"grammar-map\"><strong>📚 Day 2 语法地图（按原文实际出现整理）</strong><p>本篇确实出现的图片语法点：<b>动词时态（一般现在时、被动语态）、从句（宾语从句、定语从句、whose 定语从句）、非谓语动词（to do / doing / 过去分词 named）、系动词（stay / grow / go + 形容词）、情态动词 can、主谓一致、并列结构、名词、代词（含反身代词 herself）、冠词、介词、形容词、副词、连词（yet / when / until）、构词法（派生词：-ance / -ant / -ence / -ent / -ly / -tion）、省略（定语从句省略关系代词 that/which）、英文标点（冒号）、动词搭配（assist sb. with sth. / consist of / resist the urge）</b>等。</p><p><b>本篇没有出现：</b>虚拟语气、独立主格、倒装句、强调句、使役动词、数词、叹词。不会为了凑知识点而编造例句；以后文章出现时再单独讲。</p><small>学习方法：先看原句和翻译，再看句子骨架；术语出现时会用简单中文解释。绿色语法词可点击展开。</small></div><summary>🔎 句子拆解 · 从零理解语法（独立板块，点击展开）</summary><div class=\"grammar-intro\"><b>怎么使用：</b>先看整句白话意思，再看句子结构。下面绿色带点线的语法词可以点击，查看为什么它要这样变化。这里尽量不用术语吓你；出现术语时也会解释。</div><div class=\"grammar-sentence\"><h4>句子 1</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">介词短语作状语 During...</span><span class=\"grammar-tag\">动词搭配 assist sb. with sth.</span><span class=\"grammar-tag\">形容词 ongoing</span><span class=\"grammar-tag\">限定词 several</span></div><div class=\"en\">During an ongoing community workshop, several senior students assist newcomers with English review.</div><div class=\"zh\">在一场进行中的社区讲习班里，几位高年级学生协助新来的同学复习英语。</div><div class=\"explain\"><b>句子骨架：</b>students（学生们）+ assist（协助）+ newcomers（新来的人）+ with English review（在英语复习方面）；During an ongoing community workshop 交代背景。</div><details class=\"word-explain\"><summary>ongoing</summary><div class=\"why\">on（在……中）+ going（进行）→ ongoing 形容词“进行中的”，修饰 workshop。</div></details><details class=\"word-explain\"><summary>assist</summary><div class=\"why\">assist sb. with sth. = 在某方面帮助某人；assist 是动词“协助”。</div></details><details class=\"word-explain\"><summary>several</summary><div class=\"why\">限定词，修饰可数名词复数 students，表示“几个”。</div></details></div><div class=\"grammar-sentence\"><h4>句子 2</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">过去分词 named 作后置修饰</span><span class=\"grammar-tag\">定语从句 whose</span><span class=\"grammar-tag\">名词 assistance / aid</span><span class=\"grammar-tag\">构词法 assist → assistance</span></div><div class=\"en\">One volunteer, Mia, offers assistance to a quiet girl named Nina, whose aid notes are full of doubts.</div><div class=\"zh\">志愿者 Mia 向安静的女孩 Nina 提供帮助，她的辅助笔记里满是疑问。</div><div class=\"explain\"><b>句子骨架：</b>主句 One volunteer offers assistance to a quiet girl；named Nina 补充说明女孩名字；whose aid notes 是定语从句，说明笔记属于 Nina。</div><details class=\"word-explain\"><summary>assistance</summary><div class=\"why\">assist（动词，协助）→ assistance（名词，帮助）。offers 后需要名词作宾语。</div></details><details class=\"word-explain\"><summary>named</summary><div class=\"why\">name → named（过去分词），相当于 a girl who is named Nina；女孩“被叫作”Nina，用过去分词表被动。</div></details><details class=\"word-explain\"><summary>whose</summary><div class=\"why\">关系代词，引导定语从句，在从句中作定语修饰 aid notes，表示“她的笔记”。</div></details><details class=\"word-explain\"><summary>aid</summary><div class=\"why\">可作名词“援助、辅助”，这里 aid notes 指辅助/参考笔记。</div></details></div><div class=\"grammar-sentence\"><h4>句子 3</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">宾语从句 that</span><span class=\"grammar-tag\">情态动词 can + 原形</span><span class=\"grammar-tag\">动词分类 insist</span><span class=\"grammar-tag\">一般现在时</span><span class=\"grammar-tag\">所有格 her own</span></div><div class=\"en\">Nina insists that she can catch up on her own.</div><div class=\"zh\">Nina 坚称自己能赶上进度。</div><div class=\"explain\"><b>句子骨架：</b>主句 Nina insists；that 后面是她坚称的内容：she can catch up on her own。can 是情态动词，后接动词原形 catch up。</div><details class=\"word-explain\"><summary>insists</summary><div class=\"why\">insist 可接 that 从句，表示“坚称、坚决要求”。故事用一般现在时，主语 Nina 是第三人称单数，动词加 -s。</div></details><details class=\"word-explain\"><summary>can</summary><div class=\"why\">情态动词“能够”，后面必须接动词原形，不能写 catches。</div></details><details class=\"word-explain\"><summary>catch up</summary><div class=\"why\">固定短语“赶上、补上”；on her own = 靠她自己。</div></details></div><div class=\"grammar-sentence\"><h4>句子 4</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">不定式 to resist</span><span class=\"grammar-tag\">非谓语 giving up</span><span class=\"grammar-tag\">时间状语从句 when</span><span class=\"grammar-tag\">系动词 grow + 形容词</span><span class=\"grammar-tag\">副词 hard</span></div><div class=\"en\">Nina tries hard to resist giving up when the reading passages grow difficult.</div><div class=\"zh\">阅读文章变难时，Nina 努力克制自己不放弃。</div><div class=\"explain\"><b>句子骨架：</b>主句 Nina tries hard to resist giving up；when 引导时间背景：文章变得困难。grow 在这里是“变得”，后接形容词 difficult。</div><details class=\"word-explain\"><summary>to resist</summary><div class=\"why\">try to do = 努力做某事；to 后接动词原形 resist。</div></details><details class=\"word-explain\"><summary>giving up</summary><div class=\"why\">give up = 放弃；跟在 resist（忍住）后面用 -ing 形式：resist doing sth. 忍住做某事。</div></details><details class=\"word-explain\"><summary>grow</summary><div class=\"why\">系动词，“变得”，后接形容词 difficult，不接副词。</div></details></div><div class=\"grammar-sentence\"><h4>句子 5</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">宾语从句 that</span><span class=\"grammar-tag\">连词 yet</span><span class=\"grammar-tag\">形容词 resistant</span><span class=\"grammar-tag\">名词 resistance</span><span class=\"grammar-tag\">介词 to</span><span class=\"grammar-tag\">构词法 resist → resistant → resistance</span></div><div class=\"en\">She finds that some learners are resistant to new methods, yet her own resistance to change slowly fades.</div><div class=\"zh\">她发现有些学习者对新方法有抵触，不过她自己对改变的抗拒慢慢消退了。</div><div class=\"explain\"><b>句子骨架：</b>finds 后 that 引导宾语从句；yet（然而）连接前后两种情况。resistant 是形容词“有抵触的”，resistance 是名词“抗拒、抵抗力”。</div><details class=\"word-explain\"><summary>resistant</summary><div class=\"why\">resist（动词，抵抗）+ -ant → 形容词“有抵抗力的；抵触的”；be resistant to... 对……有抵触/抵御。</div></details><details class=\"word-explain\"><summary>resistance</summary><div class=\"why\">resist + -ance → 名词“抵抗力；抵制”；her own resistance 作从句主语。</div></details><details class=\"word-explain\"><summary>yet</summary><div class=\"why\">连词，“然而、但是”，连接转折关系的两个分句。</div></details></div><div class=\"grammar-sentence\"><h4>句子 6</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">动词搭配 consist of</span><span class=\"grammar-tag\">主谓一致（单数主语）</span><span class=\"grammar-tag\">名词复数</span><span class=\"grammar-tag\">并列结构 and</span><span class=\"grammar-tag\">名词 sample</span></div><div class=\"en\">The workshop consists of small group tasks, sample exercises, and short quizzes.</div><div class=\"zh\">讲习班由小组任务、样题练习和小测验组成。</div><div class=\"explain\"><b>句子骨架：</b>主语 the workshop 是单数，谓语 consists 用第三人称单数；consist of = 由……组成；and 连接三项并列内容。</div><details class=\"word-explain\"><summary>consists</summary><div class=\"why\">consist 是不及物动词，必须加 of 才能接组成成分；不能说 consist sth.。</div></details><details class=\"word-explain\"><summary>sample</summary><div class=\"why\">名词作定语修饰 exercises，表示“样品、样例”：sample exercises 样题练习。</div></details><details class=\"word-explain\"><summary>主谓一致</summary><div class=\"why\">workshop 单数 → consists；若主语是复数 workshops，则用 consist。</div></details></div><div class=\"grammar-sentence\"><h4>句子 7</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">系动词 stay + 形容词</span><span class=\"grammar-tag\">副词 consistently</span><span class=\"grammar-tag\">形容词 consistent / inconsistent</span><span class=\"grammar-tag\">构词法词族</span><span class=\"grammar-tag\">被动语态 are discouraged</span><span class=\"grammar-tag\">时间状语 until</span></div><div class=\"en\">Its teachers stay consistent in their methods: they consistently review the same points until everyone understands; inconsistent habits are discouraged.</div><div class=\"zh\">老师们的方法始终如一：他们一贯地复习相同要点，直到每个人都听懂；前后不一致的习惯则不被鼓励。</div><div class=\"explain\"><b>句子骨架：</b>stay consistent = 保持一致；consistently 是副词修饰 review；冒号后具体解释；inconsistent 是 consistent 的否定形式；are discouraged 是被动“不被鼓励”。</div><details class=\"word-explain\"><summary>stay</summary><div class=\"why\">系动词“保持”，后接形容词 consistent，不接副词。</div></details><details class=\"word-explain\"><summary>consistently</summary><div class=\"why\">consistent（形容词）+ -ly → 副词“一贯地”，修饰动词 review。</div></details><details class=\"word-explain\"><summary>inconsistent</summary><div class=\"why\">in-（否定前缀）+ consistent → 形容词“不一致的、无常的”。</div></details><details class=\"word-explain\"><summary>are discouraged</summary><div class=\"why\">discourage → discouraged；习惯“被劝阻”，用 be + 过去分词的被动形式。</div></details></div><div class=\"grammar-sentence\"><h4>句子 8</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">被动语态 is handed out</span><span class=\"grammar-tag\">并列句 and</span><span class=\"grammar-tag\">形容词 instant</span><span class=\"grammar-tag\">副词 instantly</span><span class=\"grammar-tag\">冠词 an</span><span class=\"grammar-tag\">系动词 go + 形容词</span></div><div class=\"en\">An instant review sheet is handed out, and instantly the room goes quiet.</div><div class=\"zh\">一张即时复习讲义发了下来，房间里立刻安静下来。</div><div class=\"explain\"><b>句子骨架：</b>前半句讲义“被发出来”，用被动 is handed out；and 连接后半句；instant 是形容词修饰 sheet，instantly 是副词修饰整个后半句。</div><details class=\"word-explain\"><summary>instant</summary><div class=\"why\">形容词“立即的、速食的”，修饰名词 sheet：an instant sheet。</div></details><details class=\"word-explain\"><summary>instantly</summary><div class=\"why\">instant + -ly → 副词“立刻、马上”，放在句首修饰句子。</div></details><details class=\"word-explain\"><summary>is handed out</summary><div class=\"why\">hand out = 分发；sheet 是“被分发”，be + 过去分词构成被动。</div></details></div><div class=\"grammar-sentence\"><h4>句子 9</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">定语从句省略关系代词</span><span class=\"grammar-tag\">一般现在时</span><span class=\"grammar-tag\">介词 from</span><span class=\"grammar-tag\">名词 quotation</span><span class=\"grammar-tag\">构词法 quote → quotation</span></div><div class=\"en\">The quotation she writes on the board comes from a famous writer.</div><div class=\"zh\">她写在黑板上的引文出自一位著名作家。</div><div class=\"explain\"><b>句子骨架：</b>主干 The quotation comes from a famous writer；she writes on the board 是修饰 quotation 的定语从句，关系代词 that/which 被省略（在从句中作宾语时可省）。</div><details class=\"word-explain\"><summary>省略</summary><div class=\"why\">定语从句 that/which she writes，关系代词在从句中作 writes 的宾语，可以省略；若作主语则不能省。</div></details><details class=\"word-explain\"><summary>quotation</summary><div class=\"why\">quote（动词，引用）→ quotation（名词，引文）。</div></details><details class=\"word-explain\"><summary>comes</summary><div class=\"why\">一般现在时，主语 quotation 单数，come 加 -s；come from = 出自。</div></details></div><div class=\"grammar-sentence\"><h4>句子 10</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">并列谓语 writes and reminds</span><span class=\"grammar-tag\">代词 it</span><span class=\"grammar-tag\">反身代词 herself</span><span class=\"grammar-tag\">副词 constantly</span><span class=\"grammar-tag\">不定式 to practice</span></div><div class=\"en\">Nina writes it down, and constantly reminds herself to practice daily.</div><div class=\"zh\">Nina 把这句话记下，并不断提醒自己每天练习。</div><div class=\"explain\"><b>句子骨架：</b>and 连接两个同一主语 Nina 发出的动作 writes、reminds；herself 是反身代词；to practice 是 remind sb. to do 结构中的不定式。</div><details class=\"word-explain\"><summary>herself</summary><div class=\"why\">she → herself（反身代词），动作落回主语自己：提醒她自己。</div></details><details class=\"word-explain\"><summary>constantly</summary><div class=\"why\">constant（形容词，不断的）+ -ly → 副词“持续不断地”，修饰 reminds。</div></details><details class=\"word-explain\"><summary>to practice</summary><div class=\"why\">remind sb. to do sth. 提醒某人做某事；to 后接动词原形。</div></details></div><div class=\"grammar-sentence\"><h4>句子 11</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">ask sb. to do</span><span class=\"grammar-tag\">非谓语 to quote</span><span class=\"grammar-tag\">介词 from</span><span class=\"grammar-tag\">代词 their</span><span class=\"grammar-tag\">形容词 useful</span></div><div class=\"en\">A teacher asks students to quote one useful sentence from their notes.</div><div class=\"zh\">老师让学生们引用笔记中一句有用的话。</div><div class=\"explain\"><b>句子骨架：</b>主干 A teacher asks students；to quote... 是补充要做的事：ask sb. to do sth. 让某人做某事。</div><details class=\"word-explain\"><summary>to quote</summary><div class=\"why\">ask 后接宾语 + 不定式；quote 保持原形。</div></details><details class=\"word-explain\"><summary>their</summary><div class=\"why\">物主代词，修饰 notes，指代 students。</div></details></div></details><div class=\"panel-card\"><div class=\"section\"><h3>易混词提示</h3><div class=\"tip\"><b>assist / assistance / aid</b>：assist 是动词“协助”；assistance 是名词“帮助”；aid 既可作名词也可作动词，指援助、辅助。<br/><b>insist / persist</b>：insist 强调“坚称、坚决要求”；persist 强调“坚持下去、持续存在”。<br/><b>resist / resistant / resistance</b>：动词“抵抗”→ 形容词“有抵抗力的、耐…的”→ 名词“抵抗力、阻力”。<br/><b>consist / consistent / consistently / inconsistent</b>：动词“由…组成”→ 形容词“一致的”→ 副词“一贯地”→ 否定形容词“不一致的”。<br/><b>quote / quotation</b>：动词“引用”→ 名词“引文”。<br/><b>instant / instantly；constant / constantly</b>：形容词 + -ly 构成对应的副词。</div></div>\n</div>", "basicHTML": "<div class=\"section\" id=\"quiz\"><h3>复习测试 · 20 词全覆盖</h3><p class=\"muted\">根据中文或句子提示填写英文。每个 PDF 目标词都考查一次；完成后点击批改。</p><div class=\"quiz\" id=\"quizForm\"><div class=\"q\" data-answer=\"assist\">1. Several volunteers ______ the newcomers.（协助）<input aria-label=\"第1题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"assistance\">2. She offered her ______ to the girl.（帮助，名词）<input aria-label=\"第2题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"aid\">3. The charity sent food and ______ to the town.（援助）<input aria-label=\"第3题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"insisted\">4. He ______ that he was right.（坚称）<input aria-label=\"第4题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"persist\">5. If you ______, you will succeed.（坚持）<input aria-label=\"第5题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"resist\">6. I couldn't ______ laughing at the joke.（忍住）<input aria-label=\"第6题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"resistant\">7. These plants are ______ to cold weather.（耐…的；有抵抗力的）<input aria-label=\"第7题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"resistance\">8. The drug builds ______ to infection.（抵抗力）<input aria-label=\"第8题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"consist\">9. The meals ______ of soup and bread.（由…组成）<input aria-label=\"第9题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"consistent\">10. Her work quality is ______.（一贯的；一致的）<input aria-label=\"第10题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"consistently\">11. He ______ arrives on time.（一贯地）<input aria-label=\"第11题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"inconsistent\">12. His answers were ______ with the facts.（不一致的）<input aria-label=\"第12题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"ongoing\">13. The project is still ______.（进行中的）<input aria-label=\"第13题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"instant\">14. The book became an ______ success.（立即的）<input aria-label=\"第14题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"instantly\">15. She left ______ after the call.（立刻）<input aria-label=\"第15题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"sample\">16. Here is a free ______ of the product.（样品）<input aria-label=\"第16题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"quote\">17. Can you ______ a line from the poem?（引用）<input aria-label=\"第17题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"quotation\">18. The ______ was taken from his speech.（引文）<input aria-label=\"第18题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"constant\">19. Keep a ______ speed while running.（恒定的；不断的）<input aria-label=\"第19题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div><div class=\"q\" data-answer=\"constantly\">20. The phone rings ______ all day.（持续不断地）<input aria-label=\"第20题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div></div><div class=\"quiz-tools\"><button class=\"quiz-btn\" onclick=\"gradeQuiz()\" type=\"button\">批改答案</button><button class=\"quiz-btn secondary\" onclick=\"resetQuiz()\" type=\"button\">重新作答</button></div><div aria-live=\"polite\" class=\"grade-summary\" id=\"gradeSummary\"></div>", "advancedHTML": "<div class=\"section\"><h3>Reading · The Summer Running Camp</h3><p class=\"muted\">全新短文，与今日故事不同。根据上下文、词性、搭配和逻辑选择单词。每个选项最多使用一次；15个选项中有5个不需要使用。</p>\n<div class=\"fill-bank\"><b>🏷️ Word Bank（15选10）</b><div class=\"fill-words\"><span class=\"fw-chip\">assistance</span><span class=\"fw-chip\">aid</span><span class=\"fw-chip\">insist</span><span class=\"fw-chip\">persist</span><span class=\"fw-chip\">resist</span><span class=\"fw-chip\">resistance</span><span class=\"fw-chip\">consistent</span><span class=\"fw-chip\">instantly</span><span class=\"fw-chip\">sample</span><span class=\"fw-chip\">quote</span><span class=\"fw-chip\">assist</span><span class=\"fw-chip\">resistant</span><span class=\"fw-chip\">consist</span><span class=\"fw-chip\">quotation</span><span class=\"fw-chip\">constant</span></div></div>\n<div class=\"fill-passage\">At a summer running camp, coaches offer <span class=\"fill-slot\">(1) <select aria-label=\"第1空\" data-answer=\"assistance\"><option value=\"\">请选择</option></select></span> to every new runner. They say that a little practical <span class=\"fill-slot\">(2) <select aria-label=\"第2空\" data-answer=\"aid\"><option value=\"\">请选择</option></select></span> can make a big difference in the first month. Trainers <span class=\"fill-slot\">(3) <select aria-label=\"第3空\" data-answer=\"insist\"><option value=\"\">请选择</option></select></span> that everyone should warm up before each run. Those who <span class=\"fill-slot\">(4) <select aria-label=\"第4空\" data-answer=\"persist\"><option value=\"\">请选择</option></select></span> and keep showing up every week usually improve fastest. Runners must <span class=\"fill-slot\">(5) <select aria-label=\"第5空\" data-answer=\"resist\"><option value=\"\">请选择</option></select></span> the urge to slow down when tired. Long-distance running builds the body's <span class=\"fill-slot\">(6) <select aria-label=\"第6空\" data-answer=\"resistance\"><option value=\"\">请选择</option></select></span> to fatigue. The best athletes keep a <span class=\"fill-slot\">(7) <select aria-label=\"第7空\" data-answer=\"consistent\"><option value=\"\">请选择</option></select></span> training schedule, not an irregular one. On the first day, each runner can <span class=\"fill-slot\">(8) <select aria-label=\"第8空\" data-answer=\"sample\"><option value=\"\">请选择</option></select></span> a short training plan designed for beginners. If asked about his secret, the coach would often <span class=\"fill-slot\">(9) <select aria-label=\"第9空\" data-answer=\"quote\"><option value=\"\">请选择</option></select></span> a line from his old mentor: “Slow and steady wins.” A good coach notices small problems <span class=\"fill-slot\">(10) <select aria-label=\"第10空\" data-answer=\"instantly\"><option value=\"\">请选择</option></select></span> and corrects them at once.</div>\n<div class=\"fill-controls\"><button class=\"quiz-btn\" type=\"button\" onclick=\"gradeFill()\">提交并批改</button><button class=\"quiz-btn secondary\" type=\"button\" onclick=\"resetFill()\">重新作答</button></div><div class=\"fill-result\" id=\"fillResult\" aria-live=\"polite\"></div><div class=\"fill-explanations\" id=\"fillExplanations\" style=\"display:none\">\n<h4>📖 全文翻译</h4><div class=\"fill-translation\"><p>在一个夏季跑步训练营，教练为每位新学员提供帮助。他们说，一点切实的辅助就能在头一个月带来很大不同。训练员坚称每个人都应该在每次跑步前热身。那些坚持下来、每周都到场的人通常进步最快。跑累的时候，跑者必须克制放慢速度的冲动。长跑能增强身体对疲劳的抵抗力。最优秀的运动员保持一贯的训练计划，而不是三天打鱼两天晒网。第一天，每位学员都可以试用一份为初学者设计的简短训练方案。当被问及秘诀时，教练常会引用他老导师的一句话：“慢而稳者胜。”好教练能立刻注意到小问题，并马上纠正。</p></div>\n<h4>🔤 词性分析 · 15个备选词</h4><div class=\"fill-pos-grid\">\n<div class=\"fill-pos-card\"><div class=\"fill-pos-title\">名词 Nouns</div>\n<div class=\"fill-pos-item\"><b>assistance</b><span>帮助；援助</span></div>\n<div class=\"fill-pos-item\"><b>aid</b><span>援助；辅助</span></div>\n<div class=\"fill-pos-item\"><b>resistance</b><span>抵抗力；阻力</span></div>\n<div class=\"fill-pos-item\"><b>sample</b><span>样品；抽样</span></div>\n<div class=\"fill-pos-item\"><b>quotation</b><span>引文；报价</span></div></div>\n<div class=\"fill-pos-card\"><div class=\"fill-pos-title\">动词 Verbs</div>\n<div class=\"fill-pos-item\"><b>assist</b><span>协助</span></div>\n<div class=\"fill-pos-item\"><b>insist</b><span>坚称；坚决要求</span></div>\n<div class=\"fill-pos-item\"><b>persist</b><span>坚持；持续</span></div>\n<div class=\"fill-pos-item\"><b>resist</b><span>抵抗；忍住</span></div>\n<div class=\"fill-pos-item\"><b>sample</b><span>试用；抽样</span></div>\n<div class=\"fill-pos-item\"><b>quote</b><span>引用；报价</span></div>\n<div class=\"fill-pos-item\"><b>consist</b><span>由…组 let activeDay=0, activeView='read', activeTab='basic', vocabQuery='';
const day=()=>DAYS[activeDay];
const VIEW_TITLE={read:'文章精读',practice:'练习中心',vocab:'词汇总表'};

function showApp(){
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-app').classList.remove('hidden');
}
function goHome(){
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('view-home').classList.remove('hidden');
  window.scrollTo({top:0});
}

function populateBank(){
  document.querySelectorAll('#advanced-fill select[data-answer]').forEach(sel=>{
    day().bank.forEach(w=>{
      const o=document.createElement('option');o.value=w;o.textContent=w;sel.appendChild(o);
    });
  });
}

function renderVocab(){
  const data=day().words;
  const q=vocabQuery.trim().toLowerCase();
  const list=document.getElementById('vocabList');
  const filtered=data.filter(w=>!q||w.w.toLowerCase().includes(q)||w.m.includes(q)||String(w.n).includes(q));
  document.getElementById('vocabCount').textContent=`共 ${filtered.length} / ${data.length} 词`;
  if(!filtered){list.innerHTML='<div class="v-empty">没有匹配的单词～</div>';return;}
  list.innerHTML=filtered.map(w=>`
    <div class="v-item">
      <div class="v-idx">${w.n}</div>
      <button class="speak-btn" data-word="${w.w}" title="播放发音" aria-label="播放发音">🔊</button>
      <div class="v-main">
        <div class="v-row"><span class="v-word">${w.w}</span><span class="v-pos">${w.p}</span></div>
        <div class="v-mean">${w.m}</div>
      </div>
    </div>`).join('');
}

function switchTab(t){
  activeTab=t;
  document.querySelectorAll('#practiceSeg button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.getElementById('panel-basic').classList.toggle('hidden',t!=='basic');
  document.getElementById('panel-advanced').classList.toggle('hidden',t!=='advanced');
}

function switchView(v){
  activeView=v;
  ['read','practice','vocab'].forEach(k=>{
    document.getElementById('mod-'+k).classList.toggle('hidden',k!==v);
  });
  document.querySelectorAll('#moduleSeg button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.getElementById('curTitle').textContent=VIEW_TITLE[v]+' · '+day().title;
}

function renderDay(){
  const d=day();
  document.getElementById('readBody').innerHTML=d.readHTML;
  document.getElementById('panel-basic').innerHTML=d.basicHTML;
  document.getElementById('panel-advanced').innerHTML=
    '<div id="advanced-fill" class="advanced-fill">'+d.advancedHTML+'</div>';
  populateBank();
  document.querySelectorAll('.day-pill').forEach((b,i)=>b.classList.toggle('active',i===activeDay));
  renderVocab();
  switchTab(activeTab);
  switchView(activeView);
}

function openDay(i,view){
  activeDay=i; activeView=view||'read'; activeTab='basic'; vocabQuery='';
  document.getElementById('vocabSearch').value='';
  renderDay(); showApp(); window.scrollTo({top:0});
}

document.querySelectorAll('.day-card').forEach(c=>{
  c.addEventListener('click',()=>openDay(Number(c.dataset.day),'read'));
});
document.querySelectorAll('.day-pill').forEach(b=>{
  b.addEventListener('click',()=>openDay(Number(b.dataset.day),activeView));
});
document.querySelectorAll('#moduleSeg button').forEach(b=>{
  b.addEventListener('click',()=>switchView(b.dataset.view));
});
document.querySelectorAll('#practiceSeg button').forEach(b=>{
  b.addEventListener('click',()=>switchTab(b.dataset.tab));
});
document.getElementById('vocabSearch').addEventListener('input',e=>{vocabQuery=e.target.value;renderVocab();});
document.getElementById('vocabList').addEventListener('click',e=>{
  const b=e.target.closest('.speak-btn');if(b)speakWord(b.dataset.word);
});
function speakWord(word){
  if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音播放');return;}
  const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=.9;
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
renderDay();
</script>
</body></html>
