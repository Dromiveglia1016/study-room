<!DOCTYPE html>
<html lang="zh-CN"><head><meta name="robots" content="noindex, nofollow"/><link rel="icon" href="../../favicon.ico"/><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/>
<title>Word Journey · 每日背词故事</title>
<style>
:root{--paper:#fff8fb;--card:#fff8fb;--ink:#2a1622;--muted:#7a6472;--sage:#ffe4f0;--green:#e0317c;--line:#f0dbe6;--gold:#ff8fc4}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:16px max(5vw,20px);background:#fff8fbed;position:sticky;top:0;border-bottom:1px solid var(--line);backdrop-filter:blur(10px);z-index:2;display:flex;justify-content:space-between}.brand{font-weight:800}.brand span{color:var(--green)}main{max-width:1100px;margin:auto;padding:30px 20px 70px}.hero{padding:34px;background:linear-gradient(120deg,#e7eee4,#f3eadb);border-radius:24px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:800}.hero h1{font-size:clamp(28px,4vw,42px);margin:8px 0}.hero p{color:#5d6a60;max-width:550px}.book{font-size:78px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.stat b{font-size:23px;display:block}.stat small,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:235px 1fr;gap:18px}.panel h3{margin:0 0 14px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.day{display:block;text-align:center;text-decoration:none;padding:8px 0;border:1px solid var(--line);background:white;border-radius:9px;color:var(--muted);font-size:13px}.day.active{background:var(--green);color:white;border-color:var(--green)}.day.pending{opacity:.48}.progress{height:6px;background:#eee;border-radius:10px;margin:12px 0}.progress span{display:block;width:.65%;height:100%;background:var(--green)}.head{display:flex;justify-content:space-between;gap:12px}.head h2{margin:4px 0;font-size:26px}.tag{background:var(--sage);color:var(--green);padding:5px 10px;border-radius:30px;font-size:12px;height:max-content}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.toggle{position:absolute;opacity:0;width:1px;height:1px}.control-label{display:inline-block;border:1px solid var(--line);background:white;border-radius:10px;padding:9px 12px;cursor:pointer;user-select:none;font-size:14px}.control-label.primary{background:var(--green);color:white;border-color:var(--green)}.control-label:hover{filter:brightness(.97)}.story{font:18px/1.95 Georgia,"Times New Roman",serif;padding:5px 2px}.story p{margin:0 0 17px}.word{font-weight:bold;color:#c02361;background:linear-gradient(transparent 60%,#e6eee0 60%)}.translation,.answers{display:none;background:#fff8fb;border-left:3px solid #a2e5df;padding:14px;margin:15px 0;border-radius:0 12px 12px 0}.section{margin-top:25px}.table{border-collapse:collapse;width:100%;font-size:14px}.table th,.table td{text:text-align:left;text-align:left;border-bottom:1px solid var(--line);padding:10px}.table th{color:var(--muted);background:#fdf5fa}.table td:nth-child(2){font-weight:bold;color:var(--green)}.tip{background:#fdf5fa;padding:14px;border-radius:12px;color:#6b5560}.quiz{display:grid;gap:9px}.q{padding:12px;border:1px solid var(--line);border-radius:11px}.q input{border:0;border-bottom:1px solid #ccc;padding:5px;width:125px;font:inherit}.notice{margin-top:18px;background:#f4f1e8;padding:15px;border-radius:12px;color:#6b5560}.coming{margin-top:20px;padding:15px;border:1px dashed #d7d6cd;border-radius:12px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
/* Native HTML disclosure widgets: no JavaScript required */
details.disclosure{margin:16px 0;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 15px}details.disclosure>summary{cursor:pointer;font-weight:700;color:var(--green);list-style:none}details.disclosure>summary::-webkit-details-marker{display:none}details.disclosure>summary:after{content:"＋";float:right}details.disclosure[open]>summary:after{content:"－"}details.disclosure .inside{padding-top:12px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:23px}.book{font-size:55px}.stats{gap:7px}.stat{padding:12px}.days{grid-template-columns:repeat(7,1fr)}}

/* Interactive word hints and quiz grading */
.wordhint{display:inline;position:relative} .wordhint>summary{display:inline;cursor:pointer;color:#c02361;font-weight:700;text-decoration:none;list-style:none} .wordhint>summary::-webkit-details-marker{display:none} .wordhint[open]>.hintbox{display:inline-block} .hintbox{display:none;position:relative;background:#fff8fb;border:1px solid #a2e5df;box-shadow:0 5px 16px #2a162218;border-radius:9px;padding:7px 10px;margin:3px 4px;font:13px/1.5 system-ui,sans-serif;color:#2a1622;vertical-align:middle} .hintbox b{color:#e0317c}
.quiz-tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0} .quiz-btn{border:1px solid var(--line);border-radius:10px;background:var(--green);color:white;padding:9px 14px;font:inherit;cursor:pointer} .quiz-btn.secondary{background:white;color:var(--ink)} .quiz .q{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .quiz .q input{width:min(240px,48vw);border:1px solid #cfcfc5;border-radius:7px;padding:7px 9px;background:#fff8fb} .quiz .q.correct{border-color:#2fb6b0;background:#effbf9} .quiz .q.incorrect{border-color:#e8709f;background:#fff1f7} .feedback{font-size:13px;font-weight:700} .grade-summary{display:none;padding:12px 15px;border-radius:12px;background:#f5f2fa;margin:12px 0;font-weight:700}

/* Click-to-translate every word in the English story */
.story .wordhint{display:inline-block;position:relative;vertical-align:baseline}
.story .wordhint>summary{display:inline;cursor:pointer;color:inherit;font-weight:inherit;text-decoration:none;list-style:none}
.story .wordhint>summary::-webkit-details-marker{display:none}
.story .wordhint .hintbox{display:none;position:absolute;z-index:5;left:0;top:calc(100% + 4px);min-width:125px;max-width:220px;white-space:normal;background:#fff8fb;border:1px solid #a2e5df;box-shadow:0 5px 16px #2a162218;border-radius:9px;padding:7px 10px;font:13px/1.5 system-ui,sans-serif;color:#2a1622}
.story .wordhint[open] .hintbox{display:block}
.story .wordhint.target-word>summary{font-weight:700;color:#c02361;background:linear-gradient(transparent 60%,#e6eee0 60%)}


/* New independent sentence-analysis module; deliberately does not alter existing lesson styling */
.grammar-module{margin-top:24px;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:18px}
.grammar-module>summary{cursor:pointer;list-style:none;font-weight:800;color:var(--green);font-size:18px}
.grammar-module>summary::-webkit-details-marker{display:none}
.grammar-module>summary:after{content:"＋";float:right}
.grammar-module[open]>summary:after{content:"－"}
.grammar-intro{background:#fdf5fa;padding:12px;border-radius:12px;margin:12px 0;color:#6b5560}
.grammar-sentence{border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0;background:#fff8fb}
.grammar-sentence h4{margin:0 0 8px;color:var(--green)}
.grammar-sentence .en{font:18px/1.8 Georgia,"Times New Roman",serif}
.grammar-sentence .zh{color:var(--muted);margin:5px 0 10px}
.grammar-sentence .explain{font-size:14px;line-height:1.75}
.grammar-sentence details.word-explain{display:inline-block;margin:4px 2px;vertical-align:baseline}
.grammar-sentence details.word-explain summary{cursor:pointer;display:inline;color:var(--green);font-weight:700;list-style:none;border-bottom:1px dotted #9eb59e}
.grammar-sentence details.word-explain summary::-webkit-details-marker{display:none}
.grammar-sentence details.word-explain .why{display:block;background:#fff8fb;border:1px solid #a2e5df;border-radius:9px;padding:8px 10px;margin-top:5px;max-width:520px}

.grammar-module .grammar-map{background:#f5f7f3;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:14px 0 18px;line-height:1.75}.grammar-module .grammar-tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.grammar-module .grammar-tag{display:inline-block;background:#e8efe5;color:#355d3a;border-radius:999px;padding:3px 9px;font-size:12px}.grammar-module .grammar-map small{color:var(--muted)}

.advanced-fill{display:block;width:100%;max-width:100%;min-width:0;overflow:visible;box-sizing:border-box}
.advanced-fill .inside,.advanced-fill .section{width:100%;max-width:100%;min-width:0;box-sizing:border-box}
.advanced-fill .fill-bank{border:1px solid var(--line);background:#f5f7f3;border-radius:12px;padding:12px;margin:12px 0;width:100%;max-width:100%;box-sizing:border-box}
.advanced-fill .fill-words{margin-top:6px;line-height:1.9;overflow-wrap:anywhere;word-break:normal}
.advanced-fill .fill-passage{display:block;line-height:2;padding:12px 0;width:100%;max-width:100%;min-width:0;box-sizing:border-box;overflow-wrap:normal;word-break:normal;white-space:normal}
.advanced-fill .fill-slot{display:inline-block;vertical-align:baseline;white-space:nowrap;max-width:100%;margin:2px 2px;box-sizing:border-box}
.advanced-fill .fill-slot select{display:inline-block;flex:none;box-sizing:border-box;border:1px solid #cfcfc5;border-radius:7px;background:#fff8fb;padding:5px 7px;width:132px;min-width:132px;max-width:132px;font:inherit;font-size:14px;vertical-align:baseline;white-space:normal}
.advanced-fill .fill-controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.advanced-fill .fill-result{display:none;padding:12px;border-radius:12px;background:#f5f2fa;margin:12px 0;font-weight:700;overflow-wrap:anywhere}
.advanced-fill .fill-explanations{border-top:1px solid var(--line);padding-top:12px;width:100%;max-width:100%;min-width:0;overflow-wrap:anywhere;box-sizing:border-box}
.advanced-fill .fill-translation{background:#fdf5fa;border-radius:12px;padding:14px;line-height:1.9}
.advanced-fill .fill-pos-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.advanced-fill .fill-pos-card{border:1px solid var(--line);border-radius:12px;background:#fff8fb;padding:12px;min-width:0}
.advanced-fill .fill-pos-title{font-weight:800;color:var(--green);border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:8px}
.advanced-fill .fill-pos-item{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:4px 0;line-height:1.7}
.advanced-fill .fill-pos-item b{min-width:100px;color:#2a1622}
.advanced-fill .fill-pos-item span{color:var(--muted)}
.advanced-fill .fill-explanations ol{padding-left:1.5em;line-height:1.9}
.advanced-fill .fill-explanations li{margin:0 0 9px}
.advanced-fill select.correct{border-color:#2fb6b0;background:#effbf9}
.advanced-fill select.incorrect{border-color:#e8709f;background:#fff1f7}
@media(max-width:700px){.advanced-fill .fill-passage{font-size:15px;line-height:1.9;padding:8px 0}.advanced-fill .fill-slot select{width:124px;min-width:124px;max-width:124px;font-size:13px;padding:4px}.advanced-fill .fill-pos-grid{grid-template-columns:1fr}.advanced-fill .fill-pos-item b{min-width:90px}}

/* Final overflow fix: allow grid content to shrink and inline blanks to wrap naturally */
.layout{grid-template-columns:235px minmax(0,1fr)}
.layout>*{min-width:0}
.advanced-fill{width:100%;min-width:0;max-width:100%;overflow:hidden}
.advanced-fill .inside,.advanced-fill .section,.advanced-fill .fill-passage{min-width:0;width:100%;max-width:100%;overflow-wrap:break-word;word-wrap:break-word}
.advanced-fill .fill-passage{white-space:normal;line-height:2.05}
.advanced-fill .fill-slot{display:inline;white-space:normal;max-width:100%;margin:0 1px}
.advanced-fill .fill-slot select{display:inline;width:clamp(88px,11vw,118px);min-width:0;max-width:100%;vertical-align:baseline;padding:4px 5px;font-size:13px}
.advanced-fill .fill-bank,.advanced-fill .fill-explanations,.advanced-fill .fill-translation{min-width:0;max-width:100%;overflow-wrap:anywhere}
@media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}.advanced-fill .fill-slot select{width:108px;max-width:100%;font-size:12px}}

/* ===== 进阶练习美化覆盖层（题目与批改逻辑不变） ===== */
#advanced-fill .section h3{font-size:20px;margin:4px 0 6px;letter-spacing:.2px}
#advanced-fill .section>p.muted{background:#fdf5fa;border-left:3px solid var(--sage);padding:10px 12px;border-radius:0 10px 10px 0;margin:10px 0 16px;line-height:1.8}
#advanced-fill .fill-bank{background:linear-gradient(135deg,#f3f7f1,#f8f5ec);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 2px 10px #2a16220a}
#advanced-fill .fill-bank>b{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:13px;letter-spacing:.5px}
#advanced-fill .fill-words{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#advanced-fill .fw-chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:#fff8fb;border:1px solid var(--line);font:600 13px/1.2 Georgia,"Times New Roman",serif;color:#2a1622;box-shadow:0 1px 3px #2a162208}
#advanced-fill .fw-chip:nth-child(odd){background:#f3f7f1}
#advanced-fill .fill-passage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;font:17px/2.1 Georgia,"Times New Roman",serif;box-shadow:0 2px 12px #2a16220a;margin:6px 0}
#advanced-fill .fill-slot{margin:0 3px}
#advanced-fill .fill-slot select{border:1px solid #d3d6c9;border-radius:10px;background:#fbfcf7;padding:5px 8px;font:600 13px system-ui,sans-serif;color:#2a1622;box-shadow:inset 0 1px 2px #2a162208;transition:border-color .15s,box-shadow .15s,background .15s}
#advanced-fill .fill-slot select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px #ffe4f0}
#advanced-fill .fill-slot select.correct{border-color:#2fb6b0;background:#effbf9;box-shadow:0 0 0 3px #e3f0e2}
#advanced-fill .fill-slot select.incorrect{border-color:#e8709f;background:#fff1f7;box-shadow:0 0 0 3px #fbe7e4}
#advanced-fill .fill-controls{margin:16px 0 4px}
#advanced-fill .fill-controls .quiz-btn{border-radius:12px;padding:10px 18px;font-weight:700;box-shadow:0 2px 6px #2a162214;transition:transform .12s,filter .12s}
#advanced-fill .fill-controls .quiz-btn:hover{filter:brightness(1.03);transform:translateY(-1px)}
#advanced-fill .fill-controls .quiz-btn.secondary{background:white}
#advanced-fill .fill-result{border-radius:14px;padding:14px 16px;background:linear-gradient(135deg,#f5f2fa,#e9f1e6);border-left:4px solid var(--green);box-shadow:0 2px 8px #2a16220a}
#advanced-fill .fill-explanations{border-top:1px dashed var(--line);padding-top:18px;margin-top:18px}
#advanced-fill .fill-explanations h4{margin:18px 0 10px;font-size:15px;color:var(--green)}
#advanced-fill .fill-translation{background:linear-gradient(135deg,#fdf5fa,#f4f1e6);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:16px 18px}
#advanced-fill .fill-pos-grid{gap:14px}
#advanced-fill .fill-pos-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 1px 6px #2a162208;border-top:3px solid var(--sage)}
#advanced-fill .fill-pos-title{display:inline-block;color:var(--green);background:#eef3ea;border-radius:999px;padding:4px 12px;font-size:13px;border-bottom:none;margin-bottom:10px}
#advanced-fill .fill-pos-item b{color:#2a1622}
#advanced-fill .fill-explanations ol{list-style:none;padding-left:0;display:grid;gap:10px}
#advanced-fill .fill-explanations li{background:#fff8fb;border:1px solid var(--line);border-radius:12px;padding:11px 14px 11px 42px;position:relative;line-height:1.75}
#advanced-fill .fill-explanations li::before{content:counter(list-item);position:absolute;left:12px;top:11px;width:20px;height:20px;border-radius:50%;background:var(--sage);color:var(--green);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
#advanced-fill .fill-explanations>p{background:#fdf5fa;border:1px dashed #d9d2bd;border-radius:12px;padding:12px 14px;color:#6b5560;margin-top:12px;line-height:1.8}
@media(max-width:700px){#advanced-fill .fill-passage{padding:16px 15px;font-size:15px}#advanced-fill .fill-pos-grid{grid-template-columns:1fr}}



@import url("https://miaoda.feishu.cn/fonts/css2?family=Mali:wght@400;500;600&family=Itim&display=swap");
/* ===== Momonga Fluffy Sky · 主题覆盖层（题目与逻辑不变） ===== */
:root{
  --mo-sky:#ffc9e2; --mo-sky-deep:#e0317c; --mo-cream:#fff1f8; --mo-paper:#fff8fb;
  --mo-blush:#ff9ecb; --mo-blush-deep:#e0317c; --mo-sage:#a2e5df; --mo-ink:#2a1622;
  --mo-ink-soft:rgba(42,22,34,.55); --mo-line:rgba(42,22,34,.28); --mo-sky-soft:#ffe4f0;
  --mo-field:#fff8fb;
}
::selection{background:var(--mo-sky);color:var(--mo-ink)}
body{
  font-family:"Mali","Itim","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color:var(--mo-ink);
  background:#b7d9f2 url("../../assets/img/60a34b94.jpg") center bottom / cover no-repeat fixed;
}
@media(max-width:1000px){ body{background-image:url("../../assets/img/34bedcdf.jpg")} }

/* 顶栏 */
header{background:var(--mo-cream);border-bottom:2px solid var(--mo-ink);box-shadow:0 3px 0 rgba(255,201,226,.7);backdrop-filter:none}
.brand{font-family:"Itim","Mali",sans-serif;letter-spacing:.5px}
.brand span{color:var(--mo-sky-deep)}
.muted{color:var(--mo-ink-soft)}

/* 主视觉 */
.hero{position:relative;overflow:hidden;background:var(--mo-paper);border:2px solid var(--mo-ink);
  border-radius:22px;outline:1.5px dashed rgba(224,49,124,.55);outline-offset:-8px;
  box-shadow:0 4px 0 rgba(255,201,226,.9);padding:34px}
.hero::after{content:"";position:absolute;top:10px;right:20px;width:196px;aspect-ratio:900/294;
  background:url("../../assets/img/73f0f8f2.png") center/contain no-repeat;pointer-events:none}
.eyebrow{color:var(--mo-sky-deep);letter-spacing:3px}
.hero h1{font-family:"Itim","Mali",sans-serif;color:var(--mo-ink)}
.hero p{color:#6d5a61;max-width:46%}
.book{display:none}

/* 统计卡片 */
.stats{gap:14px}
.stat{background:var(--mo-paper);border:2px solid var(--mo-ink);border-radius:20px;box-shadow:0 4px 0 rgba(255,201,226,.9)}
.stat b{color:var(--mo-sky-deep);font-family:"Itim"}
.stat small{color:var(--mo-ink-soft)}

/* 侧栏目录 */
.panel{background:var(--mo-paper);border:2px solid var(--mo-ink);border-radius:22px;box-shadow:0 4px 0 rgba(255,201,226,.9)}
.panel h3{color:var(--mo-ink)}
.progress{background:var(--mo-sky-soft)}
.progress span{background:var(--mo-sky-deep)}
.days{gap:8px}
.day{background:#fff;border:1.5px solid var(--mo-line);border-radius:12px;color:var(--mo-ink-soft);font-family:"Mali"}
.day.active{background:var(--mo-sky);color:var(--mo-ink);border-color:var(--mo-ink);box-shadow:0 2px 0 rgba(42,22,34,.25)}
.day.pending{opacity:.6}

/* 标题与标签 */
.head h2{font-family:"Itim","Mali",sans-serif;color:var(--mo-ink)}
.tag{background:var(--mo-sky-soft);color:var(--mo-sky-deep);border:1.5px solid var(--mo-line)}

/* 故事与点词提示 */
.story{font-family:"Mali",Georgia,"Times New Roman",serif}
.story .wordhint.target-word>summary{color:var(--mo-sky-deep);background:linear-gradient(transparent 60%,#dcebf6 60%)}
.hintbox{background:#fff;border:1.5px solid var(--mo-line);border-radius:14px;box-shadow:0 5px 16px rgba(42,22,34,.18)}
.hintbox b{color:var(--mo-sky-deep)}

/* 折叠卡片 */
details.disclosure{background:var(--mo-paper);border:2px solid var(--mo-ink);border-radius:20px;box-shadow:0 4px 0 rgba(255,201,226,.9)}
details.disclosure>summary{color:var(--mo-sky-deep);font-family:"Itim","Mali",sans-serif}
details.disclosure>summary:after{color:var(--mo-sky-deep)}

/* 表格 / 提示 / 基础测试 */
.section h3{font-family:"Itim","Mali",sans-serif;color:var(--mo-ink)}
.table th{background:var(--mo-cream);color:var(--mo-ink)}
.table td:nth-child(2){color:var(--mo-sky-deep)}
.table td{border-bottom:1px dashed var(--mo-line)}
.tip{background:rgba(198,216,181,.35);border:1.5px dashed rgba(184,112,143,.5);border-radius:16px;color:#5f5357}
.tip b{color:var(--mo-blush-deep)}
.q{background:#fff;border:1.5px solid var(--mo-line);border-radius:14px}
.q input{background:var(--mo-field);border:1.5px solid var(--mo-line)!important;border-radius:10px;color:var(--mo-ink)}
.q input:focus{border-color:var(--mo-sky-deep)!important;box-shadow:0 0 0 3px rgba(255,201,226,.55)}
.quiz-btn{background:var(--mo-sky);color:var(--mo-ink);border:2px solid var(--mo-ink);border-radius:999px;box-shadow:0 3px 0 rgba(42,22,34,.25);font-family:"Mali";font-weight:600}
.quiz-btn.secondary{background:#fff;color:var(--mo-ink)}
.q.correct{border-color:#9ccfae;background:#f0f9f2}
.q.incorrect{border-color:#e8a0a0;background:#fff4f3}
.grade-summary{background:var(--mo-sky-soft);border-left:4px solid var(--mo-sky-deep)}
.coming{border:1.5px dashed var(--mo-line);background:var(--mo-paper);color:var(--mo-ink-soft)}

  --paper:#fff8fb; --card:#fff; --ink:#2a1622; --muted:#7a6472;

<script>
function gradeQuiz(){const qs=[...document.querySelectorAll('#quizForm .q')];let score=0;qs.forEach((q,i)=>{const ans=q.dataset.answer;const input=q.querySelector('input');const val=input.value.trim().toLowerCase();q.classList.remove('correct','incorrect');let fb=q.querySelector('.feedback');if(!fb){fb=document.createElement('span');fb.className='feedback';q.appendChild(fb)}if(val===ans){score++;q.classList.add('correct');fb.textContent='✓ 正确'}else{q.classList.add('incorrect');fb.textContent=val?`✗ 正确答案：${ans}`:`未填写 · 答案：${ans}`}});const summary=document.getElementById('gradeSummary');summary.style.display='block';summary.textContent=`批改完成：${score} / ${qs.length} 分。${score===qs.length?'太棒了！本页 20 个词全部掌握！':score>=15?'不错！再复习错题巩固一下。':'别着急，结合故事和单词表复习后再挑战一次。'}`;summary.scrollIntoView({behavior:'smooth',block:'nearest'})}
function resetQuiz(){document.querySelectorAll('#quizForm .q').forEach(q=>{q.classList.remove('correct','incorrect');q.querySelector('input').value='';const fb=q.querySelector('.feedback');if(fb)fb.remove()});const s=document.getElementById('gradeSummary');s.style.display='none';s.textContent='';}
</script>
<script>function gradeFill(){const sels=[...document.querySelectorAll('#advanced-fill select[data-answer]')];let score=0;const counts={};sels.forEach(s=>{if(s.value)counts[s.value]=(counts[s.value]||0)+1});sels.forEach(s=>{s.classList.remove('correct','incorrect');const ans=s.dataset.answer.toLowerCase(),val=s.value.toLowerCase();const ok=(val===ans)||false;if(ok&&counts[val]===1){score++;s.classList.add('correct')}else{s.classList.add('incorrect')}});const r=document.getElementById('fillResult');r.style.display='block';r.textContent=`成绩：${score} / 10。${score===10?'满分！你对词性和语境判断很棒！':score>=7?'做得不错，看看解析巩固易错点。':'别急，认真看解析里的词性线索和搭配，再试一次。'}`;document.getElementById('fillExplanations').style.display='block';}

summary>the</summary><span class=\"hintbox\"><b>the</b> · 这/那；定冠词</span></details> <details class=\"wordhint\"><summary>town</summary><span class=\"hintbox\"><b>town</b> · 小镇</span></details>.</p></div>\n<details class=\"disclosure\"><summary>显示 / 隐藏中文翻译</summary><div class=\"inside translation\" id=\"translation\" style=\"display:block\"><b>中文翻译</b><br/><br/>当一座新的图书馆在小镇建成时，镇长在开放之前征求了所有人的赞成。大多数人都同意这个计划，并且签署了一份正式的协议。然而，一位名叫 Leo 的年轻工程师却不同意。他认为这栋老建筑里藏着一个从未有人发现的秘密。<br/><br/>Leo 想要找到证据。他希望改善这座图书馆，让它变得更好。他相信，一点小小的改进就能提升许多人的生活。他决定进一步调查这栋建筑的历史。<br/><br/>随着他越来越好奇，他的兴趣和兴奋感也不断增长。一天晚上，他进入了这栋老建筑，在一幅画的后面发现了一扇隐藏的门。门通向一个地下房间。他用一架小梯子抬高自己，够到了一个旧控制面板。<br/><br/>突然，电梯开始移动。奇怪的是，这栋建筑根本没有电。Leo 走了进去。老式的升降机带着他来到了一层秘密楼层。<br/><br/>当他看到一堆旧信件时，答案变得显而易见。显然，有人很多年前就把这些信藏在了那里。看来，这些信属于小镇的创始人。<br/><br/>房间的玻璃墙是透明的，透过玻璃，Leo 看见了一个美丽的地下花园。很明显，镇子的创始人建造这个地方是有特殊目的的。显然，这个秘密一点也不危险——它其实是送给镇上居民的一份礼物。</div></details></section><details class=\"grammar-module\" id=\"sentence-analysis\"><div class=\"grammar-map\"><strong>📚 Day 1 语法地图（按原文实际出现整理）</strong><p>本篇确实有不少你图片里的语法点，我们会重点讲：<b>被动语态、时间/原因/条件类连接词（when、because、as）、主谓一致、并列结构、从句、非谓语（to do / doing / 过去分词）、情态动词、比较级、名词/形容词/副词词性变化、代词、冠词、介词、强调表达、标点破折号</b>等。</p><p><b>本篇没有出现：</b>倒装句、虚拟语气、独立主格、祈使句、疑问句等。不会为了凑知识点而编造例句；以后文章出现时再单独讲。</p><small>学习方法：先看原句和翻译，再看句子骨架；术语出现时会用简单中文解释。绿色语法词可点击展开。</small></div>\n<summary>🔎 句子拆解 · 从零理解语法（独立板块，点击展开）</summary>\n<div class=\"grammar-intro\">\n<b>怎么使用：</b>先看整句白话意思，再看句子结构。下面绿色带点线的语法词可以点击，查看为什么它要这样变化。这里尽量不用术语吓你；出现术语时也会解释。\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 1</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">时间状语从句 When</span><span class=\"grammar-tag\">被动语态 was built</span><span class=\"grammar-tag\">before + doing</span><span class=\"grammar-tag\">所有格 everyone’s</span><span class=\"grammar-tag\">代词 it</span></div>\n<div class=\"en\">When a new library was built in a small town, the mayor asked for everyone's approval before opening it.</div>\n<div class=\"zh\">当一座新图书馆在小镇建成时，镇长在开放之前征求了所有人的赞成。</div>\n<div class=\"explain\"><b>先理解：</b>这句话说的是图书馆已经建好，镇长在开放前征求大家是否同意。<br/><b>句子骨架：</b>主句是 <i>the mayor asked for everyone's approval</i>（镇长征求大家的赞成）；前面的 When… 是“当……时”的时间背景；before opening it 是“在开放它之前”。</div>\n<details class=\"word-explain\"><summary>was built</summary><div class=\"why\"><b>build → built；was built = 被建造、建成。</b><br/>这是“被动表达”：不是图书馆自己建造，而是别人建造它。was 是 be 动词过去式，built 是 build 的过去分词。两者搭配表达“过去被建成”。为什么用过去？整句叙述已经发生的事情，后面的 asked 也用过去式。</div></details>\n<details class=\"word-explain\"><summary>asked</summary><div class=\"why\"><b>ask → asked（过去式）</b><br/>镇长“征求”这件事发生在过去，所以动词加 -ed。ask 是规则动词，通常直接加 -ed。</div></details>\n<details class=\"word-explain\"><summary>everyone's</summary><div class=\"why\"><b>everyone + 's = 每个人的</b><br/>'s 在这里表示“所属”，不是 is。everyone（每个人）虽然意思上包含很多人，但英语语法把它当作单数。</div></details>\n<details class=\"word-explain\"><summary>opening</summary><div class=\"why\"><b>open → opening</b><br/>这里跟在 before 后面，表示“开放这件事之前”。英语中介词（before、after、without 等）后面如果接动作，常用动词 -ing 形式。它不是这里的过去时。</div></details>\n<details class=\"word-explain\"><summary>it</summary><div class=\"why\"><b>it = 这座图书馆</b><br/>用 it 代替前面提到的 library，避免重复说 library。这里作 opening 的对象，也就是“开放它”。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 2</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">并列句 and</span><span class=\"grammar-tag\">主谓一致 people / agreement</span><span class=\"grammar-tag\">被动语态 was signed</span><span class=\"grammar-tag\">词性变化 agree → agreement</span></div>\n<div class=\"en\">Most people agreed with the plan, and an official agreement was signed.</div>\n<div class=\"zh\">大多数人同意这个计划，并且一份正式协议被签署了。</div>\n<div class=\"explain\"><b>句子骨架：</b>前半句 Most people agreed with the plan（大多数人同意计划）；and 连接第二件事 an official agreement was signed（协议被签署）。</div>\n<details class=\"word-explain\"><summary>agreed</summary><div class=\"why\"><b>agree → agreed（过去式）</b><br/>描述故事中人们当时同意计划，事情发生在过去，所以用过去式。agree 以 e 结尾，只加 -d。</div></details>\n<details class=\"word-explain\"><summary>agreement</summary><div class=\"why\"><b>agree（同意，动词）→ agreement（协议/一致，名词）</b><br/>词尾 -ment 常把动词变成名词，表示“某个行为、结果或事物”。这里 official（正式的）修饰名词 agreement，所以需要名词。</div></details>\n<details class=\"word-explain\"><summary>was signed</summary><div class=\"why\"><b>sign → signed；was signed = 被签署</b><br/>协议是“被人签署”的，因此用 was + 过去分词 signed。was 表示过去；signed 表示签署这个动作。被动句重点是协议，而不是签署的人。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 3</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">过去式 disagreed</span><span class=\"grammar-tag\">过去分词短语 named Leo</span><span class=\"grammar-tag\">转折词 However</span></div>\n<div class=\"en\">However, a young engineer named Leo disagreed.</div>\n<div class=\"zh\">然而，一位名叫 Leo 的年轻工程师不同意。</div>\n<div class=\"explain\"><b>句子骨架：</b>a young engineer（一个年轻工程师）是“谁”；disagreed（不同意）是他做的动作。named Leo 补充说明工程师的名字。</div>\n<details class=\"word-explain\"><summary>named</summary><div class=\"why\"><b>name → named（被叫作 / 名叫）</b><br/>这里不是主句谓语，而是简化的描述，相当于 an engineer who was named Leo（一个被叫作 Leo 的工程师）。工程师“被命名”，所以用过去分词形式来表达被动含义。</div></details>\n<details class=\"word-explain\"><summary>disagreed</summary><div class=\"why\"><b>disagree = dis-（不/相反）+ agree（同意）</b><br/>disagree 是“不同意”。disagreed 是过去式，因为 Leo 在故事当时表达了不同意见。以 e 结尾的动词加 -d。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 4</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">宾语从句（believed 后）</span><span class=\"grammar-tag\">定语从句 that...</span><span class=\"grammar-tag\">过去完成时 had discovered</span><span class=\"grammar-tag\">had = 拥有（不是完成时）</span></div>\n<div class=\"en\">He believed the old building had a secret that nobody had discovered.</div>\n<div class=\"zh\">他认为这栋老建筑藏着一个从未有人发现的秘密。</div>\n<div class=\"explain\"><b>句子骨架：</b>He believed（他认为）+ 后面说他认为的内容：the old building had a secret（老建筑有个秘密）。that nobody had discovered 是补充说明 secret：一个没人发现过的秘密。</div>\n<details class=\"word-explain\"><summary>believed</summary><div class=\"why\"><b>believe → believed（过去式）</b><br/>Leo 当时“认为”某件事，所以叙述用过去式。believe 以 e 结尾，加 -d。</div></details>\n<details class=\"word-explain\"><summary>had</summary><div class=\"why\"><b>have → had（过去式）</b><br/>这里 had 表示“拥有/有”，不是“过去完成时”的助动词。主句在讲过去，所以 have 变成 had。</div></details>\n<details class=\"word-explain\"><summary>that</summary><div class=\"why\"><b>that 引出补充说明秘密的句子</b><br/>that nobody had discovered = “没有人发现过”。这里 that 类似连接标记，告诉我们后面的话用来描述 secret。</div></details>\n<details class=\"word-explain\"><summary>had discovered</summary><div class=\"why\"><b>discover → discovered；had + 过去分词 = 过去完成时</b><br/>过去完成时可以理解成“在过去某个时间点之前已经发生”。Leo 当时发现/想到这个秘密，而“没人发现它”在那个时间之前就已经成立，所以用 had discovered。had 是助动词，discovered 是过去分词。这里不是简单因为句子整体过去就随便加 had，而是表达“更早之前已经没有人发现”。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 5</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">一般过去时</span><span class=\"grammar-tag\">名词 proof（不可数）</span></div>\n<div class=\"en\">Leo wanted proof.</div>\n<div class=\"zh\">Leo 想要证据。</div>\n<div class=\"explain\"><b>句子骨架：</b>Leo（谁）+ wanted（想要）+ proof（证据，想要的东西）。</div>\n<details class=\"word-explain\"><summary>wanted</summary><div class=\"why\"><b>want → wanted（过去式）</b><br/>他当时想要证据。故事叙述过去的想法，用过去式。want 是规则动词，直接加 -ed。</div></details>\n<details class=\"word-explain\"><summary>proof</summary><div class=\"why\"><b>proof 是名词</b><br/>这里是“证据”。proof 通常作不可数名词，意思是证据/证明；一般不说 a proof 来表示一条证据，常说 some proof 或 a piece of proof。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 6</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">不定式 to do</span><span class=\"grammar-tag\">并列结构 improve and make</span><span class=\"grammar-tag\">使役/结果结构 make + 宾语 + 形容词</span><span class=\"grammar-tag\">比较级 better</span></div>\n<div class=\"en\">He hoped to improve the library and make it even better.</div>\n<div class=\"zh\">他希望改善这座图书馆，让它变得更好。</div>\n<div class=\"explain\"><b>句子骨架：</b>He hoped（他希望）+ to improve… and make…（希望做的两件事：改善图书馆、让它更好）。to 后面接动词原形；and 把两个动作连起来。</div>\n<details class=\"word-explain\"><summary>hoped</summary><div class=\"why\"><b>hope → hoped（过去式）</b><br/>Leo 当时抱有希望，所以用过去式。hope 以 e 结尾，加 -d。</div></details>\n<details class=\"word-explain\"><summary>to improve</summary><div class=\"why\"><b>to + 动词原形 improve</b><br/>to 在这里是“不定式标记”，提示后面是一个动作：“去改善”。hope to do something（希望做某事）是常见搭配。improve 没有变成过去式，因为 to 后面通常接动词原形。</div></details>\n<details class=\"word-explain\"><summary>make</summary><div class=\"why\"><b>make it better = 让它变得更好</b><br/>make 后面可以接对象（it）再接描述对象的词（better），表示“使某物变成某种状态”。这里 make 与 improve 并列，都是 hoped 后面的动作，因此都保持原形。</div></details>\n<details class=\"word-explain\"><summary>better</summary><div class=\"why\"><b>good → better（更好）</b><br/>better 是 good 的比较级，不按普通规则加 -er。这里表示图书馆变得“更好”，与原来相比。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 7</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">宾语从句 that...</span><span class=\"grammar-tag\">情态动词 could</span><span class=\"grammar-tag\">名词复数 lives</span><span class=\"grammar-tag\">词性变化 improvement</span></div>\n<div class=\"en\">He believed that a small improvement could enhance the lives of many people.</div>\n<div class=\"zh\">他相信，一点小小的改进就能提升许多人的生活。</div>\n<div class=\"explain\"><b>句子骨架：</b>He believed that…（他相信……）；that 后面是相信的内容。a small improvement（一个小改进）是做事的主体；could enhance（能够提升）是动作；the lives of many people（许多人的生活）是被提升的对象。</div>\n<details class=\"word-explain\"><summary>believed</summary><div class=\"why\"><b>believe → believed</b><br/>故事过去时叙述，所以“相信”用过去式。它也和前面句子中的 believed 呼应。</div></details>\n<details class=\"word-explain\"><summary>improvement</summary><div class=\"why\"><b>improve（改善，动词）→ improvement（改善/改进，名词）</b><br/>词尾 -ment 常把动作变成名词。这里 small（小的）修饰 improvement，因此要用名词形式：“一个小改进”。</div></details>\n<details class=\"word-explain\"><summary>could</summary><div class=\"why\"><b>can → could</b><br/>could 是 can 的过去形式，也可以表达过去视角下的能力/可能性。这里 Leo 当时相信一个小改进“能够”带来帮助。could 后必须接动词原形。</div></details>\n<details class=\"word-explain\"><summary>enhance</summary><div class=\"why\"><b>enhance 保持原形</b><br/>因为前面有情态动词 could（能够），英语规则是 could + 动词原形，所以不能写 enhances、enhanced 或 enhancing。</div></details>\n<details class=\"word-explain\"><summary>lives</summary><div class=\"why\"><b>life → lives（复数）</b><br/>这里 life 是“生活”，many people（许多人）对应很多人的生活，因此用复数 lives。以 f 结尾的部分名词会变成 ves：life → lives。注意 lives 在这里是名词复数，不是动词 lives（居住）。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 8</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">decide to do</span><span class=\"grammar-tag\">短语动词 look into</span><span class=\"grammar-tag\">副词 further</span></div>\n<div class=\"en\">He decided to look further into the history of the building.</div>\n<div class=\"zh\">他决定进一步调查这栋建筑的历史。</div>\n<div class=\"explain\"><b>句子骨架：</b>He decided（他决定）+ to look further into…（进一步调查……）。look into 是“调查、查看”的意思，further 表示更深入/进一步。</div>\n<details class=\"word-explain\"><summary>decided</summary><div class=\"why\"><b>decide → decided（过去式）</b><br/>他当时做出了决定，故事用过去式。decide 以 e 结尾加 -d。</div></details>\n<details class=\"word-explain\"><summary>to look</summary><div class=\"why\"><b>decide to do something = 决定做某事</b><br/>decide 后常接 to + 动词原形。to 不是“去某个地方”的介词，而是帮助组成“要做的动作”。look 保持原形。</div></details>\n<details class=\"word-explain\"><summary>further</summary><div class=\"why\"><b>further = 更进一步、更深入</b><br/>修饰 look into，告诉我们调查的程度：不是只看一点，而是继续深入调查。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 9</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">As 引导时间/伴随关系</span><span class=\"grammar-tag\">begin to do</span><span class=\"grammar-tag\">比较结构 more curious</span><span class=\"grammar-tag\">并列主语与主谓一致</span><span class=\"grammar-tag\">词性变化 growth</span></div>\n<div class=\"en\">As he began to grow more curious, his interest and excitement showed steady growth.</div>\n<div class=\"zh\">随着他越来越好奇，他的兴趣和兴奋感也不断增长。</div>\n<div class=\"explain\"><b>句子骨架：</b>前半句 As he began… 表示“随着……”；主句 his interest and excitement showed steady growth（他的兴趣和兴奋感显示出持续增长）。</div>\n<details class=\"word-explain\"><summary>began</summary><div class=\"why\"><b>begin → began（不规则过去式）</b><br/>begin 不能简单加 -ed，过去式是 began，需要记忆。它表示“开始”，发生在故事过去。</div></details>\n<details class=\"word-explain\"><summary>to grow</summary><div class=\"why\"><b>grow 保持原形：begin to do = 开始做某事</b><br/>began 后接 to grow。began 已经承担过去时，后面的 grow 不再变过去式。这是英语句子里很重要的规律：一个句子里不需要每个动词都变过去时。</div></details>\n<details class=\"word-explain\"><summary>curious</summary><div class=\"why\"><b>curious 是形容词：好奇的</b><br/>more curious = 更好奇。more 放在较长形容词前，表示“更……”。</div></details>\n<details class=\"word-explain\"><summary>showed</summary><div class=\"why\"><b>show → showed（不规则过去式）</b><br/>show 的过去式是 showed。这里主语 interest and excitement 是两个东西（复合主语），但在过去时中动词仍使用过去式 showed。</div></details>\n<details class=\"word-explain\"><summary>growth</summary><div class=\"why\"><b>grow（增长，动词）→ growth（增长，名词）</b><br/>这里 steady（持续稳定的）修饰 growth，因此需要名词。-th 在 growth 这个词中形成名词，词形变化不完全规则，需要整体记忆。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 10</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">并列谓语 entered and found</span><span class=\"grammar-tag\">过去分词 hidden 作修饰</span><span class=\"grammar-tag\">介词短语 behind...</span></div>\n<div class=\"en\">One evening, he entered the old building and found a hidden door behind a painting.</div>\n<div class=\"zh\">一天晚上，他进入了这栋老建筑，在一幅画的后面发现了一扇隐藏的门。</div>\n<div class=\"explain\"><b>句子骨架：</b>he entered… and found…（他进入……并发现……）。and 连接两个由同一个 he 做的动作，因此两个动词都用过去式。</div>\n<details class=\"word-explain\"><summary>entered</summary><div class=\"why\"><b>enter → entered（过去式）</b><br/>进入发生在故事过去，所以加 -ed。enter 后面直接接地点/建筑，不需要加 into：enter the building。</div></details>\n<details class=\"word-explain\"><summary>found</summary><div class=\"why\"><b>find → found（不规则过去式）</b><br/>find 的过去式是 found，不是 finded。和 entered 并列，都是 he 做的过去动作。</div></details>\n<details class=\"word-explain\"><summary>hidden</summary><div class=\"why\"><b>hide → hid → hidden</b><br/>hidden 是 hide 的过去分词形式。这里 hidden door 是“被藏起来的门”，hidden 像形容词一样修饰 door，表达门处于被隐藏的状态。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 11</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">一般过去时 led</span><span class=\"grammar-tag\">固定搭配 lead to</span><span class=\"grammar-tag\">冠词 an</span></div>\n<div class=\"en\">The door led to an underground room.</div>\n<div class=\"zh\">这扇门通向一个地下房间。</div>\n<div class=\"explain\"><b>句子骨架：</b>The door（这扇门）+ led to（通向）+ an underground room（一个地下房间）。lead to 是固定搭配，表示“通向、导致”。</div>\n<details class=\"word-explain\"><summary>led</summary><div class=\"why\"><b>lead → led（不规则过去式）</b><br/>这里 lead 读 /liːd/，意思是“通向/引领”。过去式 led，拼写变了，需要记住。不是 led by electricity 中的其他含义。</div></details>\n<details class=\"word-explain\"><summary>underground</summary><div class=\"why\"><b>under（下面）+ ground（地面）→ underground（地下的）</b><br/>它在 room 前面修饰 room，说明房间在哪里：地下的房间。它也可以作副词，表示在地下。</div></details>\n<details class=\"word-explain\"><summary>an</summary><div class=\"why\"><b>an 用在元音音素开头的单词前</b><br/>underground 开头发音是元音，所以用 an underground room。a/an 都表示一个，选择主要看后面单词的开头发音，而不是字母。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 12</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">目的状语 to do</span><span class=\"grammar-tag\">并列动词 elevate and reach</span><span class=\"grammar-tag\">反身代词 himself</span><span class=\"grammar-tag\">冠词 a / an</span></div>\n<div class=\"en\">He used a small ladder to elevate himself and reach an old control panel.</div>\n<div class=\"zh\">他用一架小梯子抬高自己，够到了一个旧控制面板。</div>\n<div class=\"explain\"><b>句子骨架：</b>He used a small ladder（他用了一个小梯子）+ to elevate himself and reach…（用它来抬高自己并够到……）。to 后面的两个动作 elevate 和 reach 并列，都用原形。</div>\n<details class=\"word-explain\"><summary>used</summary><div class=\"why\"><b>use → used（过去式）</b><br/>他当时使用梯子，故事过去时，所以加 -d。注意 used to do（过去常常）是另一个结构；本句 used 是普通动词“使用”。</div></details>\n<details class=\"word-explain\"><summary>to elevate</summary><div class=\"why\"><b>to + 动词原形，表示目的：为了抬高</b><br/>他使用梯子的目的是什么？为了让自己升高、够到面板。elevate 保持原形，因为 to 后接动词原形。</div></details>\n<details class=\"word-explain\"><summary>himself</summary><div class=\"why\"><b>he → himself（他自己）</b><br/>动作施加在自己身上时用反身代词。he 是“他”，himself 是“他自己”。这里 Leo 抬高的是自己。</div></details>\n<details class=\"word-explain\"><summary>reach</summary><div class=\"why\"><b>reach 保持原形</b><br/>它与 elevate 并列，都跟在 to 后面：to elevate himself and reach…。第一个动词前有 to，第二个并列动作通常不重复 to，但仍用原形。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 13</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">begin to do</span><span class=\"grammar-tag\">一般过去时 began</span></div>\n<div class=\"en\">Suddenly, the elevator began to move.</div>\n<div class=\"zh\">突然，电梯开始移动。</div>\n<div class=\"explain\"><b>句子骨架：</b>the elevator（电梯）+ began（开始）+ to move（移动）。Suddenly 是“突然”，说明动作发生得很突然。</div>\n<details class=\"word-explain\"><summary>began</summary><div class=\"why\"><b>begin → began（不规则过去式）</b><br/>电梯在故事中开始移动，是过去发生的动作，因此用 began。</div></details>\n<details class=\"word-explain\"><summary>to move</summary><div class=\"why\"><b>begin to do = 开始做某事</b><br/>began 已经是过去式，to 后面的 move 用原形。英语并不是把所有动词都改成过去式。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 14</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">原因状语从句 because</span><span class=\"grammar-tag\">一般过去时 was / had</span><span class=\"grammar-tag\">no + 名词</span></div>\n<div class=\"en\">It was strange because the building had no electricity.</div>\n<div class=\"zh\">奇怪的是，这栋建筑根本没有电。</div>\n<div class=\"explain\"><b>句子骨架：</b>It was strange（这很奇怪）+ because（因为）+ the building had no electricity（建筑没有电）。because 后面解释原因。</div>\n<details class=\"word-explain\"><summary>was</summary><div class=\"why\"><b>is → was（过去式）</b><br/>描述当时的情况“很奇怪”，时间在故事过去。be 动词过去式：I/he/she/it 用 was；you/we/they 用 were。</div></details>\n<details class=\"word-explain\"><summary>had</summary><div class=\"why\"><b>have → had（过去式）</b><br/>这里表示“拥有/有电”，不是完成时的 had。建筑当时没有电，所以用过去形式 had。no electricity = 没有电。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 15</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">一般过去时</span><span class=\"grammar-tag\">过去式拼写：step → stepped</span></div>\n<div class=\"en\">Leo stepped inside.</div>\n<div class=\"zh\">Leo 走了进去。</div>\n<div class=\"explain\"><b>句子骨架：</b>Leo（谁）+ stepped（迈步）+ inside（里面/向里面）。inside 在这里告诉我们他走到哪里/朝哪里。</div>\n<details class=\"word-explain\"><summary>stepped</summary><div class=\"why\"><b>step → stepped（过去式）</b><br/>step 是“迈步”。短元音 + 单个辅音结尾的词，变过去式时常双写最后辅音再加 -ed：step → stepped。这样保持前面短元音的读音。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 16</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">一般过去时 took</span><span class=\"grammar-tag\">宾格代词 him</span><span class=\"grammar-tag\">方向副词 down</span><span class=\"grammar-tag\">固定搭配 take someone to</span></div>\n<div class=\"en\">The old lift took him down to a secret floor.</div>\n<div class=\"zh\">老式升降机带着他来到了一层秘密楼层。</div>\n<div class=\"explain\"><b>句子骨架：</b>The old lift（老升降机）+ took（带/载）+ him（他）+ down（向下）+ to a secret floor（到秘密楼层）。take someone to… 表示带某人去某处。</div>\n<details class=\"word-explain\"><summary>took</summary><div class=\"why\"><b>take → took（不规则过去式）</b><br/>电梯带他下去，这件事发生在过去。take 的过去式不是 taked，而是 took。</div></details>\n<details class=\"word-explain\"><summary>him</summary><div class=\"why\"><b>he → him（宾格）</b><br/>he 是“他”在句子里做动作的主语形式；him 是“他”作为动作对象的形式。电梯带的是 Leo，所以用 him。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 17</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">时间状语从句 when</span><span class=\"grammar-tag\">系动词 become + 形容词</span><span class=\"grammar-tag\">名词 collection</span><span class=\"grammar-tag\">冠词 a</span></div>\n<div class=\"en\">The answer became obvious when he saw a collection of old letters.</div>\n<div class=\"zh\">当他看到一堆旧信件时，答案变得显而易见。</div>\n<div class=\"explain\"><b>句子骨架：</b>The answer became obvious（答案变得明显）+ when he saw…（当他看到……时）。when 引出发生时间。</div>\n<details class=\"word-explain\"><summary>became</summary><div class=\"why\"><b>become → became（不规则过去式）</b><br/>become（变成）过去式 became。答案在那时变得明显，是故事过去的变化。</div></details>\n<details class=\"word-explain\"><summary>obvious</summary><div class=\"why\"><b>obvious 是形容词：明显的</b><br/>became（变得）后面可以接形容词，说明变成什么状态：became obvious（变得明显）。</div></details>\n<details class=\"word-explain\"><summary>saw</summary><div class=\"why\"><b>see → saw（不规则过去式）</b><br/>看到信件是过去发生的动作，see 的过去式是 saw，不是 seed。</div></details>\n<details class=\"word-explain\"><summary>collection</summary><div class=\"why\"><b>collect（收集，动词）→ collection（收藏/一批，名词）</b><br/>这里 a collection of letters 表示“一批/一组信件”。a 后面需要一个名词，因此使用 collection。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 18</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">句首评述副词 Obviously</span><span class=\"grammar-tag\">过去完成时 had hidden</span><span class=\"grammar-tag\">宾格 them</span><span class=\"grammar-tag\">ago 与过去时间</span></div>\n<div class=\"en\">Obviously, someone had hidden them there many years ago.</div>\n<div class=\"zh\">显然，有人很多年前就把这些信藏在了那里。</div>\n<div class=\"explain\"><b>句子骨架：</b>someone（某人）+ had hidden（藏了）+ them（它们）+ there（在那里）。Obviously 是说话者对整件事的判断：“显然”。</div>\n<details class=\"word-explain\"><summary>Obviously</summary><div class=\"why\"><b>obvious（明显的，形容词）→ obviously（显然地，副词）</b><br/>词尾 -ly 常把形容词变成副词。副词可以放在句首，表达说话者对整句话的判断。</div></details>\n<details class=\"word-explain\"><summary>had hidden</summary><div class=\"why\"><b>hide → hid → hidden；had + 过去分词 = 过去完成时</b><br/>隐藏信件发生在 Leo 发现它们之前很多年。以故事的过去时“发现”为参照，更早发生的隐藏动作使用 had hidden。had 是助动词，hidden 是过去分词。</div></details>\n<details class=\"word-explain\"><summary>them</summary><div class=\"why\"><b>they → them（宾格）</b><br/>them 指前面提到的 letters（信件）。someone 把信藏起来，“信”是动作对象，所以用 them。</div></details>\n<details class=\"word-explain\"><summary>ago</summary><div class=\"why\"><b>ago = 以前</b><br/>many years ago = 很多年前。ago 通常搭配过去时间，帮助我们明确事情发生在过去。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 19</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">句首评述副词 Apparently</span><span class=\"grammar-tag\">belong to</span><span class=\"grammar-tag\">所有格 town’s</span></div>\n<div class=\"en\">Apparently, the letters belonged to the town's founder.</div>\n<div class=\"zh\">看来，这些信属于小镇的创始人。</div>\n<div class=\"explain\"><b>句子骨架：</b>the letters（这些信）+ belonged to（属于）+ the town's founder（小镇的创始人）。Apparently 表示根据现有线索“看来/似乎”。</div>\n<details class=\"word-explain\"><summary>Apparently</summary><div class=\"why\"><b>apparent（看起来明显的）→ apparently（看来/显然，副词）</b><br/>-ly 常把形容词变成副词。Apparently 放句首，表示这是根据目前情况作出的判断，语气常有“看来是这样”。</div></details>\n<details class=\"word-explain\"><summary>belonged</summary><div class=\"why\"><b>belong → belonged（过去式）</b><br/>belong to = 属于。信属于创始人这个情况在故事过去被发现/判断，所以用 belonged。belong 以 g 结尾直接加 -ed。</div></details>\n<details class=\"word-explain\"><summary>town's</summary><div class=\"why\"><b>town + 's = 小镇的</b><br/>这里 's 表示所属：the town's founder = 小镇的创始人。它不是 is 的缩写。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 20</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">并列句 and</span><span class=\"grammar-tag\">主谓一致 walls were</span><span class=\"grammar-tag\">情态动词 could + 原形</span><span class=\"grammar-tag\">介词 through + them</span><span class=\"grammar-tag\">地点补充 underground</span></div>\n<div class=\"en\">The glass walls of the room were transparent, and through them Leo could see a beautiful garden underground.</div>\n<div class=\"zh\">房间的玻璃墙是透明的，透过玻璃，Leo 看见了一个美丽的地下花园。</div>\n<div class=\"explain\"><b>句子骨架：</b>前半句 glass walls were transparent（玻璃墙是透明的）；后半句 Leo could see a garden（Leo 能看见花园）。through them（透过它们）指透过玻璃墙。</div>\n<details class=\"word-explain\"><summary>were</summary><div class=\"why\"><b>are → were（过去式）</b><br/>主语 glass walls 是复数（多面墙），be 动词过去式用 were。was 用于 I/he/she/it 等单数；were 用于 you/we/they 及复数主语。</div></details>\n<details class=\"word-explain\"><summary>transparent</summary><div class=\"why\"><b>transparent 是形容词：透明的</b><br/>be 动词 were 后面接形容词，说明玻璃墙是什么状态：were transparent（是透明的）。</div></details>\n<details class=\"word-explain\"><summary>through</summary><div class=\"why\"><b>through = 穿过/透过</b><br/>through them 指透过前面提到的玻璃墙看过去。</div></details>\n<details class=\"word-explain\"><summary>could see</summary><div class=\"why\"><b>can → could；could + 动词原形 see</b><br/>could 是 can 的过去形式，表示当时“能够看见”。could 后的 see 必须用原形，不能写 saw。虽然中文说“看见了”，英语用 could see 强调当时能看到。</div></details>\n<details class=\"word-explain\"><summary>underground</summary><div class=\"why\"><b>underground = 地下的/在地下</b><br/>这里描述 garden 所在的位置：一个地下花园。它放在 garden 后面，补充说明花园在哪里。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 21</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">形式主语 It</span><span class=\"grammar-tag\">that 主语从句</span><span class=\"grammar-tag\">过去完成时 had created</span><span class=\"grammar-tag\">for 表目的/对象</span></div>\n<div class=\"en\">It was evident that the founder had created this place for a special purpose.</div>\n<div class=\"zh\">很明显，镇子的创始人建造这个地方是有特殊目的的。</div>\n<div class=\"explain\"><b>句子骨架：</b>It was evident（很明显）+ that 后面的内容：the founder had created this place（创始人建造了这个地方）。这里 It 是形式上的开头，真正要说明的事情在 that 后面。</div>\n<details class=\"word-explain\"><summary>was</summary><div class=\"why\"><b>is → was（过去式）</b><br/>当时“很明显”，故事以过去视角叙述，所以用 was。</div></details>\n<details class=\"word-explain\"><summary>evident</summary><div class=\"why\"><b>evident 是形容词：明显的</b><br/>was 后面接形容词，描述“明显”这个状态。It was evident that… 是常见表达：“很明显……”。</div></details>\n<details class=\"word-explain\"><summary>had created</summary><div class=\"why\"><b>create → created；had + 过去分词 = 过去完成时</b><br/>创始人建造这个地方的动作发生在故事当前过去时间之前。用 had created 表示“在那个过去时刻之前已经建造好了”。had 是助动词，created 是过去分词。</div></details>\n</div>\n<div class=\"grammar-sentence\">\n<h4>句子 22</h4><div class=\"grammar-tags\"><span class=\"grammar-tag\">句首评述副词 Evidently</span><span class=\"grammar-tag\">否定强调 not...at all</span><span class=\"grammar-tag\">破折号解释补充</span><span class=\"grammar-tag\">be + 名词 was a gift</span></div>\n<div class=\"en\">Evidently, the secret was not dangerous at all—it was a gift for the people of the town.</div>\n<div class=\"zh\">显然，这个秘密一点也不危险——它其实是送给镇上居民的一份礼物。</div>\n<div class=\"explain\"><b>句子骨架：</b>the secret was not dangerous（秘密并不危险）— it was a gift（它是一份礼物）。Evidently 是“显然/看来”，not…at all 是“一点也不”。破折号连接进一步解释。</div>\n<details class=\"word-explain\"><summary>Evidently</summary><div class=\"why\"><b>evident（明显的，形容词）→ evidently（显然地，副词）</b><br/>词尾 -ly 常把形容词变成副词。放句首时，表达说话者对后面内容的判断。</div></details>\n<details class=\"word-explain\"><summary>was</summary><div class=\"why\"><b>is → was（过去式）</b><br/>秘密当时“不危险”，并且“是一份礼物”，叙述故事时用过去式 was。</div></details>\n<details class=\"word-explain\"><summary>dangerous</summary><div class=\"why\"><b>danger（危险，名词）→ dangerous（危险的，形容词）</b><br/>-ous 常见作用是构成形容词，表示“具有……性质的”。not dangerous = 不危险。</div></details>\n<details class=\"word-explain\"><summary>at all</summary><div class=\"why\"><b>not … at all = 一点也不……</b><br/>at all 常用于否定句，加强否定语气。这里 not dangerous at all = 一点也不危险。</div></details>\n<details class=\"word-explain\"><summary>was a gift</summary><div class=\"why\"><b>was + 名词</b><br/>be 动词可以连接主语和名词，表示“是什么”。it was a gift = 它是一份礼物。a 表示“一份/一个”，gift 是名词。</div></details>\n</div>\n</details>\n<div class=\"panel-card\"><div class=\"section\"><h3>易混词提示</h3><div class=\"tip\"><b>agree → agreement</b>：动词“同意”→ 名词“协议 / 一致”。<br><b>improve → improvement</b>：动词“改善”→ 名词“改进”。<br><b>obvious / evident</b>：都表示“明显的”。<br><b>obviously / evidently / apparently</b>：都可表达“显然 / 看来”；apparently 常有“据目前情况看来”的语气。<br><b>elevator / lift</b>：都指电梯；elevator 更常见于美式英语，lift 更常见于英式英语。</br></br></br></br></div></div>\n</div>", "basicHTML": "<div class=\"section\" id=\"quiz\"><h3>复习测试 · 20 词全覆盖</h3><p class=\"muted\">根据中文或句子提示填写英文。每个 PDF 目标词都考查一次；完成后点击批改。</p><div class=\"quiz\" id=\"quizForm\">\n<div class=\"q\" data-answer=\"approval\">1. 赞成；批准：<input aria-label=\"第1题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"agree\">2. Most people ______ with the plan.（同意）<input aria-label=\"第2题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"agreement\">3. 协议；一致（名词）：<input aria-label=\"第3题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"disagree\">4. He ______ with the decision.（不同意）<input aria-label=\"第4题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"proof\">5. 证据；证明：<input aria-label=\"第5题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"improve\">6. We hope to ______ the library.（改善）<input aria-label=\"第6题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"improvement\">7. 改进；改善（名词）：<input aria-label=\"第7题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"enhance\">8. 提高；增强：<input aria-label=\"第8题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"further\">9. 调查得更深入；进一步：<input aria-label=\"第9题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"grow\">10. Interest began to ______.（增长；逐渐变得）<input aria-label=\"第10题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"growth\">11. 增长；成长（名词）：<input aria-label=\"第11题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"elevate\">12. 用动作/高度“抬高；提升”：<input aria-label=\"第12题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"elevator\">13. 电梯（美式英语）：<input aria-label=\"第13题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"lift\">14. 电梯（英式）；举起：<input aria-label=\"第14题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"obvious\">15. The answer was ______.（明显的）<input aria-label=\"第15题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"obviously\">16. ______, someone had hidden the letters.（显然地）<input aria-label=\"第16题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"apparently\">17. 看来；据目前情况显然：<input aria-label=\"第17题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"transparent\">18. 玻璃是 ______ 的。（透明的）<input aria-label=\"第18题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"evident\">19. 很明显的；显而易见的（形容词）：<input aria-label=\"第19题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n<div class=\"q\" data-answer=\"evidently\">20. ______, the secret was harmless.（显然地；看来）<input aria-label=\"第20题\" autocomplete=\"off\" placeholder=\"填写英文单词\"/></div>\n</div><div class=\"quiz-tools\"><button class=\"quiz-btn\" onclick=\"gradeQuiz()\" type=\"button\">批改答案</button><button class=\"quiz-btn secondary\" onclick=\"resetQuiz()\" type=\"button\">重新作答</button></div><div aria-live=\"polite\" class=\"grade-summary\" id=\"gradeSummary\"></div>", "advancedHTML": "<div class=\"section\"><h3>Reading · A New Community Reading Room</h3><p class=\"muted\">全新短文，与今日故事不同。根据上下文、词性、搭配和逻辑选择单词。每个选项最多使用一次；15个选项中有5个不需要使用。</p>\n<div class=\"fill-bank\"><b>Word Bank（15选10）</b><div class=\"fill-words\"><span class=\"fw-chip\">approval</span><span class=\"fw-chip\">agree</span><span class=\"fw-chip\">agreement</span><span class=\"fw-chip\">proof</span><span class=\"fw-chip\">improve</span><span class=\"fw-chip\">improvement</span><span class=\"fw-chip\">enhance</span><span class=\"fw-chip\">further</span><span class=\"fw-chip\">growth</span><span class=\"fw-chip\">obvious</span><span class=\"fw-chip\">apparently</span><span class=\"fw-chip\">transparent</span><span class=\"fw-chip\">evidently</span><span class=\"fw-chip\">benefit</span><span class=\"fw-chip\">maintain</span></div></div>\n<div class=\"fill-passage\">Last month, a small community decided to open a reading room. The plan first needed the town council’s <span class=\"fill-slot\">(1) <select aria-label=\"第1空\" data-answer=\"approval\"><option value=\"\">请选择</option></select></span>. Most residents seemed to <span class=\"fill-slot\">(2) <select aria-label=\"第2空\" data-answer=\"agree\"><option value=\"\">请选择</option></select></span> that children needed a quiet place to study. After several meetings, they reached an <span class=\"fill-slot\">(3) <select aria-label=\"第3空\" data-answer=\"agreement\"><option value=\"\">请选择</option></select></span> about how to use the building.<br><br>Volunteers collected books and offered to <span class=\"fill-slot\">(4) <select aria-label=\"第4空\" data-answer=\"improve\"><option value=\"\">请选择</option></select></span> the old room. At first, the lack of furniture was an <span class=\"fill-slot\">(5) <select aria-label=\"第5空\" data-answer=\"obvious\"><option value=\"\">请选择</option></select></span> problem. They then made a few small changes, and the space became more comfortable. These changes brought a real <span class=\"fill-slot\">(6) <select aria-label=\"第6空\" data-answer=\"improvement\"><option value=\"\">请选择</option></select></span>.<br><br>The organizers wanted to <span class=\"fill-slot\">(7) <select aria-label=\"第7空\" data-answer=\"enhance\"><option value=\"\">请选择</option></select></span> the reading experience, so they added lamps and soft chairs. The number of visitors began to show steady <span class=\"fill-slot\">(8) <select aria-label=\"第8空\" data-answer=\"growth\"><option value=\"\">请选择</option></select></span>. The room’s rules were posted clearly on a <span class=\"fill-slot\">(9) <select aria-label=\"第9空\" data-answer=\"transparent\"><option value=\"\">请选择</option></select></span> system, and everyone could see how donations were spent. <span class=\"fill-slot\">(10) <select aria-label=\"第10空\" data-answer=\"Evidently\"><option value=\"\">请选择</option></select></span>, the project had become a valued part of the neighborhood.</div>\n<div class=\"fill-controls\"><button class=\"quiz-btn\" type=\"button\" onclick=\"gradeFill()\">提交并批改</button><button class=\"quiz-btn secondary\" type=\"button\" onclick=\"resetFill()\">重新作答</button></div><div class=\"fill-result\" id=\"fillResult\" aria-live=\"polite\"></div><div class=\"fill-explanations\" id=\"fillExplanations\" style=\"display:none\">\n<h4>📖 全文翻译</h4><div class=\"fill-translation\"><p>上个月，一个小社区决定开设一间阅览室。这个计划首先需要得到镇议会的批准。大多数居民似乎都同意，孩子们需要一个安静的学习场所。经过几次会议，他们就如何使用这栋建筑达成了协议。</p><p>志愿者们收集了书籍，并主动提出改善旧房间。起初，缺少家具是一个明显的问题。随后他们做了一些小改动，空间变得更加舒适。这些变化带来了真正的改善。</p><p>组织者希望提升阅读体验，于是添置了灯和舒适的椅子。访客数量开始稳步增长。阅览室的规则被清楚地公布在一个透明公开的制度中，大家都能看到捐款是如何使用的。显然，这个项目已经成为社区中备受珍视的一部分。</p></div>\n<h4>🔤 词性分析 · 15个备选词</h4><div class=\"fill-pos-grid\">\n<div class=\"fill-pos-card\"><div class=\"fill-pos-title\">名词 Nouns</div><div class=\"fill-pos-item\"><b>approval</b><span>批准；赞同</span></div><div class=\"fill-pos-item\"><b>agreement</b><span>协议；一致</span></div><div class=\"fill-pos-item\"><b>proof</b><span>证据</span></div><div class=\"fill-pos-item\"><b>improvement</b><span>改善；改进</span></div><div class=\"fill-pos-item\"><b>growth</b><span>增长</span></div><div class=\"fill-pos-item\"><b>benefit</b><span>益处；好处</span></div></div>\n<div class=\"fill-pos-card\"><div class=\"fill-pos-title\">动词 Verbs</div><div class=\"fill-pos-item\"><b>agree</b><span>同意</span></div><div class=\"fill-pos-item\"><b>improve</b><span>改善；提高</span></div><div class=\"fill-pos-item\"><b>enhance</b><span>提升；增强</span></div><div class=\"fill-pos-item\"><b>maintain</b><span>维持；保持</span></div><div class=\"fill-pos-item\"><b>benefit</b><span>使受益；得益</span></div></div>\n<div class=\"fill-pos-card\"><div class=\"fill-pos-title\">形容词 Adjectives</div><div class=\"fill-pos-item\"><b>obvious</b><span>明显的</span></div><div class=\"fill-pos-item\"><b>transparent</b><span>透明的；公开的</span></div><div class=\"fill-pos-item\"><b>further</b><span>进一步的</span></div></div>\n<div class=\"fill-pos-card\"><div class=\"fill-pos-title\">副词 Adverbs</div><div class=\"fill-pos-item\"><b>apparently</b><span>看来；似乎</span></div><div cl
